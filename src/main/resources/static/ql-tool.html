<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青龙调试工具</title>
<link rel="stylesheet" href="common.css">
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; overflow: hidden; }

/* ===== 顶栏 ===== */
.ql-topbar { display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 20px; }
.ql-logo { font-size: 15px; font-weight: 800; background: linear-gradient(135deg,#059669,#10b981); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.ql-topbar .spacer { flex: 1; }
.ql-home-link { color: var(--color-text-muted); text-decoration: none; font-size: 12.5px; }
.ql-home-link:hover { color: var(--color-primary); }
.ql-conn-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 9px; border-radius: 20px; background: rgba(99,102,241,0.06); color: var(--color-text-muted); }
.ql-conn-badge.online { background: rgba(16,185,129,0.10); color: #059669; }
.ql-conn-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ===== 主体 ===== */
.ql-main { flex: 1; display: flex; min-height: 0; }

/* ===== 侧栏 ===== */
.ql-sider { width: 220px; flex-shrink: 0; overflow-y: auto; background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); border-right: 1px solid rgba(0,0,0,0.04); padding: 10px 8px; font-size: 13px; }
.ql-sider .ql-search input { width: 100%; padding: 7px 10px; font-size: 12px; margin-bottom: 8px; }
.ql-sider .ql-btns { display: flex; gap: 4px; margin-bottom: 8px; }
.ql-sider .ql-btns button { flex: 1; font-size: 11px; padding: 5px 0; }
.ql-group-title { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-weight: 700; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; border-radius: 6px; }
.ql-group-title:hover { background: rgba(0,0,0,0.02); }
.ql-group-title .arrow { font-size: 9px; transition: transform .2s; }
.ql-group.collapsed .arrow { transform: rotate(-90deg); }
.ql-group.collapsed .ql-group-items { display: none; }
.ql-device { display: flex; align-items: center; gap: 6px; padding: 7px 10px 7px 24px; border-radius: 6px; cursor: pointer; color: var(--color-text-secondary); font-size: 12.5px; }
.ql-device:hover { background: rgba(16,185,129,0.05); }
.ql-device.active { background: rgba(16,185,129,0.10); color: #059669; font-weight: 600; }
.ql-device .dev-dot { width: 5px; height: 5px; border-radius: 50%; background: #ccc; }
.ql-device .dev-dot.on { background: #10b981; }

/* ===== 右侧面板（上下分割）===== */
.ql-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.ql-content-top { flex: 1; overflow-y: auto; padding: 16px 20px; }
.ql-content-bottom { flex-shrink: 0; border-top: 1px solid rgba(0,0,0,0.06); padding: 12px 20px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); max-height: 180px; overflow-y: auto; }

/* ===== 设备头 ===== */
.ql-dev-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.ql-dev-title { font-size: 16px; font-weight: 700; margin: 0; }
.ql-dev-meta { font-size: 11px; color: var(--color-text-muted); display: flex; gap: 10px; }
.ql-dev-actions { margin-left: auto; display: flex; gap: 8px; }
.ql-dev-actions .glass-btn { padding: 7px 14px; font-size: 12.5px; }
.btn-connect { background: linear-gradient(135deg,#10b981,#059669); }
.btn-disconnect { background: linear-gradient(135deg,#f87171,#ef4444); }

/* ===== 能力条（紧凑 mini tag）===== */
.ql-cap-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.ql-cap { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; background: rgba(16,185,129,0.06); border: 1px solid rgba(16,185,129,0.10); }
.ql-cap .k { color: var(--color-text-muted); }
.ql-cap .v { font-weight: 700; color: #059669; font-family: var(--font-mono); }

/* ===== Tab 栏 ===== */
.ql-tabs { display: flex; gap: 2px; border-bottom: 1px solid rgba(0,0,0,0.06); margin-bottom: 10px; flex-wrap: wrap; }
.ql-tab { padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--color-text-muted); border-bottom: 2px solid transparent; transition: all .12s; }
.ql-tab:hover { color: var(--color-text); }
.ql-tab.active { color: #059669; border-bottom-color: #059669; font-weight: 600; }

/* ===== 数据表 ===== */
.ql-table-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ql-table-toolbar input { width: 180px; padding: 6px 10px; font-size: 12px; }
.ql-table-toolbar .count { font-size: 11px; color: var(--color-text-muted); margin-left: auto; }
.ql-table-wrap { overflow: auto; max-height: calc(100vh - 340px); border: 1px solid rgba(0,0,0,0.05); border-radius: 8px; }
.ql-table-wrap table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ql-table-wrap th { position: sticky; top: 0; z-index: 2; background: #f8fafb; padding: 7px 10px; text-align: left; font-size: 11.5px; font-weight: 600; color: var(--color-text-secondary); border-bottom: 1px solid rgba(0,0,0,0.06); white-space: nowrap; }
.ql-table-wrap td { padding: 6px 10px; border-bottom: 1px solid rgba(0,0,0,0.03); color: var(--color-text); font-family: var(--font-mono); font-size: 12px; }
.ql-table-wrap tr:nth-child(even) td { background: rgba(0,0,0,0.015); }
.ql-table-wrap tr:hover td { background: rgba(16,185,129,0.04); }
/* 状态色 */
.ql-table-wrap td.s-alarm { color: #dc2626; font-weight: 600; }
.ql-table-wrap td.s-ok { color: #059669; }
.ql-table-wrap td.s-warn { color: #d97706; }
.ql-table-wrap td.s-muted { color: #9ca3af; }

/* ===== 下发操作区 ===== */
.ql-ops-title { font-size: 12px; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 8px; }
.ql-ops-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
.ql-ops-row + .ql-ops-row { margin-top: 10px; }
.ql-ops-item { display: flex; flex-direction: column; gap: 2px; }
.ql-ops-item label { font-size: 10.5px; color: var(--color-text-muted); }
.ql-ops-item input { width: 90px; padding: 6px 8px; font-size: 12px; }
.ql-ops-item input[type="text"] { width: 160px; }
.ql-ops-item .glass-btn { padding: 7px 12px; font-size: 12px; }

/* ===== 状态卡片（堆垛机）===== */
.ql-section-title { font-size: 12.5px; font-weight: 700; color: var(--color-text); margin: 12px 0 6px; display: flex; align-items: center; gap: 8px; }
.ql-refresh-time { font-size: 10.5px; color: var(--color-text-muted); font-weight: 400; }
.ql-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.ql-field { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.5); border: 1px solid rgba(0,0,0,0.04); border-radius: 8px; padding: 8px 10px; }
.ql-field .k { font-size: 11.5px; color: var(--color-text-secondary); }
.ql-field .v { font-size: 12.5px; font-weight: 600; color: var(--color-text); font-family: var(--font-mono); }
.ql-field.alarm { border-color: rgba(239,68,68,0.25); background: rgba(239,68,68,0.03); }
.ql-field.alarm .v { color: #dc2626; }
.ql-field.success .v { color: #059669; }
.ql-field.warn .v { color: #d97706; }

/* ===== Toast ===== */
.ql-toast { position: fixed; top: 60px; right: 20px; z-index: 2000; padding: 10px 16px; border-radius: 8px; font-size: 12.5px; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.12); opacity: 0; transform: translateY(-8px); transition: opacity .2s, transform .2s; pointer-events: none; }
.ql-toast.show { opacity: 1; transform: translateY(0); }
.ql-toast.ok { background: linear-gradient(135deg,#10b981,#059669); }
.ql-toast.err { background: linear-gradient(135deg,#ef4444,#dc2626); }

/* ===== 确认弹窗 ===== */
.ql-confirm-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1500; }
.ql-confirm-box { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 16px 48px rgba(0,0,0,.15); max-width: 380px; width: 90%; text-align: center; }
.ql-confirm-box h3 { margin: 0 0 6px; font-size: 15px; }
.ql-confirm-box p { margin: 0 0 16px; font-size: 13px; color: var(--color-text-secondary); }
.ql-confirm-btns { display: flex; justify-content: center; gap: 10px; }

/* ===== 设备管理弹窗 ===== */
.ql-modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1500; }
.ql-modal { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.18); max-width: 520px; width: 92%; max-height: 80vh; overflow-y: auto; position: relative; }
.ql-modal h3 { margin: 0 0 16px; font-size: 16px; }
.ql-modal-close { position: absolute; top: 14px; right: 18px; font-size: 18px; cursor: pointer; color: var(--color-text-muted); }
.ql-modal-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ql-modal-form .full { grid-column: 1 / -1; }
.ql-modal-form label { font-size: 11px; color: var(--color-text-muted); margin-bottom: 3px; display: block; }
.ql-modal-form input, .ql-modal-form select { width: 100%; padding: 8px 10px; font-size: 13px; }
.ql-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.ql-dev-list-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid rgba(0,0,0,0.04); }
.ql-dev-list-item .info { flex: 1; }
.ql-dev-list-item .info .name { font-weight: 600; font-size: 13px; }
.ql-dev-list-item .info .meta { font-size: 11px; color: var(--color-text-muted); }
.ql-dev-list-item .ops a { font-size: 12px; cursor: pointer; text-decoration: none; margin-left: 8px; }
.ql-dev-list-item .ops .edit { color: var(--color-primary); }
.ql-dev-list-item .ops .del { color: var(--color-error); }

/* ===== 输送线拓扑地图 ===== */
.ql-map-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:2px 0 8px; }
.ql-map-toolgroup { display:flex; align-items:center; gap:5px; padding-right:10px; border-right:1px solid rgba(148,163,184,.28); }
.ql-map-toolgroup:last-of-type { border-right:0; padding-right:0; }
.ql-map-toolbar .glass-btn-outline { height:30px; padding:0 10px; border-color:rgba(100,116,139,.28); color:#334155; font-size:12px; }
.ql-map-toolbar .glass-btn-outline:hover { border-color:#0f766e; color:#0f766e; background:#f0fdfa; }
.ql-map-toolbar .ql-map-action.is-active { color:#fff; border-color:#0f766e; background:#0f766e; box-shadow:0 2px 7px rgba(15,118,110,.25); }
.ql-map-toolbar .ql-map-delete { color:#b91c1c; border-color:rgba(220,38,38,.35); }
.ql-map-toolbar .ql-map-delete:hover:not(:disabled) { color:#fff; border-color:#dc2626; background:#dc2626; }
.ql-map-toolbar button:disabled { cursor:not-allowed; opacity:.4; }
.ql-map-live { margin-left:auto; color:#64748b; font:600 11px var(--font-mono); white-space:nowrap; }
.ql-map-live.online { color:#047857; }
.ql-map-subbar { display:flex; align-items:center; gap:12px; margin-bottom:8px; padding:7px 10px; border:1px solid #dce6ee; border-radius:8px; background:#f8fafc; }
.ql-map-guide { color:#64748b; font-size:11px; }
.ql-map-legend { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-left:auto; }
.ql-legend-item { display:flex; align-items:center; gap:4px; color:#475569; font-size:10.5px; white-space:nowrap; }
.ql-legend-dot { width:8px; height:8px; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 3px rgba(15,23,42,.1); }
.ql-legend-idle { background:#0f766e; }
.ql-legend-load { background:#16a34a; }
.ql-legend-task { background:#d97706; }
.ql-legend-alarm { background:#dc2626; }
.ql-map-stage { position:relative; height:calc(100vh - 336px); min-height:330px; overflow:hidden; border:1px solid #cbd8e4; border-radius:11px; background:#eef3f8; box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 12px rgba(15,23,42,.04); }
#cv_mapcanvas { width:100%; height:100%; }
.ql-map-empty { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:#475569; text-align:center; font-size:13px; font-weight:600; background:linear-gradient(135deg,rgba(248,250,252,.92),rgba(238,243,248,.92)); pointer-events:none; }
.ql-map-empty small { color:#94a3b8; font-size:11px; font-weight:400; }
.ql-map-empty[hidden] { display:none; }
@media (max-width: 900px) { .ql-map-live { width:100%; margin-left:0; } .ql-map-subbar { align-items:flex-start; flex-direction:column; } .ql-map-legend { margin-left:0; } }

/* ===== 堆垛机 Tab ===== */
.ql-panel-card { margin-top: 12px; }

/* ===== 响应式 ===== */
@media (max-width: 900px) { .ql-sider { width: 180px; } }
@media (max-width: 640px) { .ql-sider { display: none; } }
</style>

<style>
/* ===== 2026 操作台视觉重构 ===== */
:root {
    --ql-ink: #10231f;
    --ql-muted: #64736f;
    --ql-line: #dfe8e4;
    --ql-panel: #ffffff;
    --ql-bg: #f3f7f5;
    --ql-brand: #087f67;
    --ql-brand-dark: #075e50;
    --ql-brand-soft: #e6f5f0;
    --ql-danger: #d84b4b;
}
* { box-sizing: border-box; }
body {
    color: var(--ql-ink);
    background:
        radial-gradient(circle at 78% -10%, rgba(30, 166, 130, .08), transparent 32%),
        var(--ql-bg);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.ql-topbar {
    height: 64px;
    padding: 0 24px;
    gap: 18px;
    background: rgba(255,255,255,.94);
    border-bottom: 1px solid var(--ql-line);
    box-shadow: 0 1px 0 rgba(16,35,31,.02);
    backdrop-filter: blur(16px);
}
.ql-brand-mark {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    color: #fff;
    font-size: 17px;
    background: linear-gradient(145deg, #0aa77f, #076a59);
    box-shadow: 0 7px 16px rgba(8,127,103,.22);
}
.ql-brand-copy { display: flex; flex-direction: column; gap: 1px; }
.ql-logo {
    color: var(--ql-ink);
    font-size: 15px;
    line-height: 1.2;
    font-weight: 760;
    background: none;
    -webkit-text-fill-color: currentColor;
}
.ql-brand-sub { color: #82908c; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
.ql-top-divider { width: 1px; height: 24px; background: var(--ql-line); }
.ql-conn-badge {
    gap: 7px;
    min-height: 30px;
    padding: 5px 11px;
    border: 1px solid #e0e7e5;
    background: #f8faf9;
    color: #7b8985;
    font-size: 11.5px;
}
.ql-conn-badge.online { border-color: #bde5d8; background: #ebf8f4; color: #087f67; }
.ql-conn-badge .dot { width: 7px; height: 7px; box-shadow: 0 0 0 3px currentColor; opacity: .7; }
.ql-clock { color: #7a8783; font: 11px var(--font-mono); }
.ql-home-link {
    padding: 7px 10px;
    border-radius: 8px;
    color: #52615d;
    font-size: 12px;
}
.ql-home-link:hover { color: var(--ql-brand); background: var(--ql-brand-soft); }

.ql-main { min-height: 0; }
.ql-sider {
    width: 272px;
    padding: 20px 14px;
    background: #f9fbfa;
    border-right: 1px solid var(--ql-line);
    backdrop-filter: none;
}
.ql-sider-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
.ql-sider-title { color: #253d36; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.ql-sider-total { color: #87948f; font: 10px var(--font-mono); }
.ql-search { position: relative; }
.ql-search::before {
    content: "⌕";
    position: absolute;
    z-index: 1;
    left: 12px;
    top: 9px;
    color: #7c8d87;
    font-size: 17px;
    line-height: 1;
}
.ql-sider .ql-search input {
    height: 38px;
    margin-bottom: 10px;
    padding: 8px 12px 8px 34px;
    border: 1px solid #dbe5e1;
    border-radius: 10px;
    background: #fff;
    box-shadow: none;
}
.ql-sider .ql-search input:focus { border-color: #6fc0a9; box-shadow: 0 0 0 3px rgba(8,127,103,.1); }
.ql-site-block { margin: 2px 0 14px; }
.ql-site-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.ql-site-label { color: #8a9692; font-size: 9.5px; font-weight: 750; letter-spacing: .12em; }
.ql-site-manage {
    padding: 2px 5px; border: 0; color: #7467eb; background: transparent;
    font-size: 10px; font-weight: 700; cursor: pointer;
}
.ql-site-tabs { display: flex; gap: 7px; overflow-x: auto; padding: 2px 1px 6px; scrollbar-width: thin; }
.ql-site-tab {
    min-width: 142px; padding: 10px 12px; border: 1px solid #dce1fb; border-radius: 11px;
    color: #596662; background: rgba(255,255,255,.82); text-align: left; cursor: pointer;
    box-shadow: 0 3px 10px rgba(74,66,190,.04); flex: 0 0 auto;
}
.ql-site-tab strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.ql-site-tab small { display: block; margin-top: 4px; color: #9aa4a1; font-size: 9px; }
.ql-site-tab.active {
    border-color: #7770f5; color: #fff;
    background: linear-gradient(135deg,#625df2,#8858ee);
    box-shadow: 0 7px 16px rgba(99,91,238,.20);
}
.ql-site-tab.active small { color: rgba(255,255,255,.78); }
.ql-site-add {
    min-width: 38px; display: grid; place-items: center; padding: 0; font-size: 18px;
    color: #7165ee; border-style: dashed; background: #f8f7ff;
}
.ql-site-list-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid #eef0f5; }
.ql-site-list-row input { flex: 1; min-width: 0; }
.ql-site-list-row .site-count { min-width: 58px; color: #8b9692; font-size: 10px; }
.ql-site-list-row button { padding: 6px 9px; font-size: 10px; }
.ql-sider .ql-btns { gap: 8px; margin-bottom: 18px; }
.ql-sider .ql-btns button {
    min-height: 34px;
    padding: 6px 10px;
    border-color: #d5e1dd;
    border-radius: 9px;
    color: #4c5e58;
    background: #fff;
    font-size: 11.5px;
    font-weight: 650;
}
.ql-sider .ql-btns button:first-child { color: #fff; border-color: var(--ql-brand); background: var(--ql-brand); }
.ql-group + .ql-group { margin-top: 10px; }
.ql-group-title {
    min-height: 34px;
    padding: 7px 9px;
    color: #5b6c66;
    font-size: 11.5px;
    letter-spacing: .02em;
}
.ql-group-title:hover { background: #eef4f1; }
.ql-group-title .arrow { color: #97a49f; }
.ql-device {
    position: relative;
    min-height: 52px;
    margin: 3px 0;
    padding: 8px 32px 8px 34px;
    border: 1px solid transparent;
    border-radius: 10px;
    color: #52625d;
    font-size: 12.5px;
}
.ql-device-copy { min-width: 0; display: flex; flex: 1; flex-direction: column; gap: 3px; }
.ql-device-name { overflow: hidden; color: inherit; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
.ql-device-address {
    overflow: hidden; color: #93a19d; font: 9.5px/1.2 var(--font-mono);
    letter-spacing: .01em; text-overflow: ellipsis; white-space: nowrap;
}
.ql-device.active .ql-device-address { color: #599b89; }
.ql-device:hover { background: #eef6f3; }
.ql-device.active {
    border-color: #cbe7de;
    background: #e6f5f0;
    color: #076b59;
    box-shadow: 0 3px 10px rgba(8,127,103,.06);
}
.ql-device.active::after {
    content: "›";
    position: absolute;
    right: 12px;
    top: 8px;
    color: #55a991;
    font-size: 18px;
}
.ql-device .dev-dot { width: 7px; height: 7px; background: #b7c1be; box-shadow: 0 0 0 3px #edf1f0; }
.ql-device .dev-dot.on { background: #12a879; box-shadow: 0 0 0 3px #d9f2ea; }
.ql-device[draggable="true"] { user-select:none; }
.ql-device-drag {
    display:flex; width:18px; height:30px; margin-left:auto; flex:0 0 auto; align-items:center; justify-content:center;
    border-radius:6px; color:#8b9b96; cursor:grab; font:700 14px/1 var(--font-mono); letter-spacing:-4px; opacity:.42;
}
.ql-device:hover .ql-device-drag { opacity:.9; }
.ql-device-drag:active { cursor:grabbing; }
.ql-device.dragging { opacity:.28; }
.ql-group-items.device-sorting .ql-device:not(.dragging) { transition:transform .12s,background .12s; }
.ql-device.active::after { display:none; }

.ql-content { background: transparent; }
.ql-content-top { padding: 20px 24px 14px; }
.ql-dev-header {
    min-height: 82px;
    margin-bottom: 14px;
    padding: 16px 18px;
    border: 1px solid var(--ql-line);
    border-radius: 14px;
    background: rgba(255,255,255,.92);
    box-shadow: 0 8px 24px rgba(22,55,46,.055);
}
.ql-dev-identity { display: flex; align-items: center; gap: 13px; }
.ql-dev-icon {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    border-radius: 12px;
    color: var(--ql-brand);
    background: var(--ql-brand-soft);
    font-size: 20px;
}
.ql-dev-title-line { display: flex; align-items: center; gap: 9px; }
.ql-dev-title { color: #17342c; font-size: 18px; font-weight: 760; letter-spacing: -.02em; }
.ql-dev-state {
    padding: 3px 8px;
    border-radius: 999px;
    background: #f1f4f3;
    color: #75817d;
    font-size: 10px;
    font-weight: 650;
}
.ql-dev-state.online { color: #08745f; background: #def3ec; }
.ql-dev-meta { margin-top: 5px; gap: 7px; color: #71807b; font-size: 11px; }
.ql-dev-meta span { padding-right: 8px; border-right: 1px solid #e4ebe8; }
.ql-dev-meta span:last-child { border-right: 0; }
.ql-dev-actions { gap: 8px; }
.ql-dev-actions .glass-btn,
.ql-dev-actions .glass-btn-outline { min-height: 36px; padding: 8px 14px; border-radius: 9px; font-weight: 650; box-shadow: none; }
.ql-task-toggle { border-color: #d9e4e0; color: #42564f; background: #fff; }
.btn-connect { border: 0; background: var(--ql-brand); box-shadow: 0 5px 12px rgba(8,127,103,.18); }
.btn-connect:hover { background: var(--ql-brand-dark); }
.btn-disconnect { border: 0; background: #f8e8e8; color: #b53c3c; box-shadow: none; }
.btn-disconnect:hover { background: #f3dada; }

.ql-cap-bar { gap: 8px; margin: 0 0 12px; }
.ql-cap { min-height: 30px; padding: 5px 10px; border-color: #dce9e4; border-radius: 8px; background: #fff; }
.ql-cap .v { color: var(--ql-brand); }
.ql-tabs {
    gap: 5px;
    margin-bottom: 12px;
    padding: 5px;
    border: 1px solid var(--ql-line);
    border-radius: 11px;
    background: rgba(255,255,255,.72);
    flex-wrap: nowrap;
    overflow-x: auto;
}
.ql-tab {
    flex: 0 0 auto;
    padding: 8px 12px;
    border: 0;
    border-radius: 8px;
    color: #667570;
    font-size: 11.5px;
}
.ql-tab:hover { color: #17342c; background: #eef4f1; }
.ql-tab.active { color: #fff; border: 0; background: var(--ql-brand); box-shadow: 0 3px 8px rgba(8,127,103,.18); }
.ql-table-toolbar { min-height: 42px; margin: 0; padding: 8px 10px; border-bottom: 1px solid var(--ql-line); background: #fff; }
.ql-table-toolbar::before { content: "筛选"; color: #6d7b77; font-size: 11px; font-weight: 650; }
.ql-table-toolbar input { width: 240px; height: 32px; border-color: #dbe4e1; border-radius: 8px; background: #f8faf9; box-shadow: none; }
.ql-table-toolbar .count { padding: 4px 8px; border-radius: 999px; background: #f0f4f2; color: #697873; }
.ql-table-wrap {
    max-height: calc(100vh - 400px);
    border: 1px solid var(--ql-line);
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 8px 22px rgba(22,55,46,.045);
}
.ql-table-toolbar + .ql-table-wrap { border-top-left-radius: 0; border-top-right-radius: 0; }
.ql-table-wrap th { height: 40px; padding: 9px 12px; background: #f4f7f6; color: #53645e; font-size: 11px; letter-spacing: .02em; }
.ql-table-wrap td { height: 40px; padding: 8px 12px; border-bottom-color: #edf2f0; font-size: 11.5px; }
.ql-table-wrap tr:nth-child(even) td { background: #fbfcfc; }
.ql-table-wrap tr:hover td { background: #edf8f4; }

.ql-content-bottom {
    max-height: 260px;
    padding: 14px 24px 18px;
    border-top: 1px solid var(--ql-line);
    background: rgba(247,250,249,.96);
    box-shadow: 0 -10px 28px rgba(22,55,46,.045);
    transition: max-height .2s ease, padding .2s ease;
}
.ql-content-bottom.is-collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; border-top-color: transparent; }
.ql-content-bottom > div:first-child { display: grid !important; grid-template-columns: minmax(0,1.35fr) minmax(360px,1fr); gap: 14px !important; }
.ql-content-bottom > div:first-child > div {
    min-width: 0 !important;
    padding: 13px 14px 14px;
    border: 1px solid var(--ql-line);
    border-radius: 12px;
    background: #fff;
}
.ql-ops-title { margin-bottom: 10px; color: #28433b; font-size: 12px; font-weight: 750; }
.ql-ops-row { gap: 8px; }
.ql-ops-item { gap: 4px; }
.ql-ops-item label { color: #71807b; font-size: 10px; font-weight: 600; }
.ql-ops-item input { height: 34px; width: 78px; padding: 7px 9px; border-color: #d9e4e0; border-radius: 8px; background: #fbfcfc; box-shadow: none; }
.ql-ops-item input:focus { border-color: #70bda8; box-shadow: 0 0 0 3px rgba(8,127,103,.09); }
.ql-ops-item .glass-btn { min-height: 34px; border-radius: 8px; }

.ql-field { min-height: 46px; border-color: var(--ql-line); background: #fff; }
.ql-panel-card { padding: 14px; border: 1px solid var(--ql-line); border-radius: 12px; background: #fff; box-shadow: 0 8px 22px rgba(22,55,46,.04); }
.ql-map-stage { border-color: #cddbd6; border-radius: 12px; background: #edf3f1; }
.ql-map-head {
    display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 10px 12px;
    border: 1px solid var(--ql-line); border-radius: 12px 12px 0 0; background: #fff;
}
.ql-map-heading { display: flex; min-width: 180px; flex-direction: column; gap: 2px; }
.ql-map-heading strong { color: #223d35; font-size: 13px; }
.ql-map-heading span { color: #84918d; font-size: 10px; }
.ql-map-search { display: flex; align-items: center; gap: 6px; }
.ql-map-search input { width: 190px; height: 32px; padding: 6px 10px; border-radius: 8px; box-shadow: none; }
.ql-map-search button { height: 32px; padding: 0 11px; border-radius: 8px; font-size: 11px; }
.ql-map-toolbar {
    min-height: 46px; margin: 0; padding: 7px 10px; border: 1px solid var(--ql-line);
    border-top: 0; background: #f8faf9;
}
.ql-map-toolgroup { gap: 6px; padding-right: 10px; border-right-color: #dce5e1; }
.ql-map-toolbar .glass-btn-outline {
    height: 31px; padding: 0 11px; border-color: #d7e2de; border-radius: 8px;
    background: #fff; color: #4d6059; font-size: 11px; font-weight: 650;
}
.ql-map-toolbar .ql-map-action.is-active { border-color: var(--ql-brand); background: var(--ql-brand); box-shadow: 0 3px 8px rgba(8,127,103,.18); }
.ql-map-file-tools { margin-left: auto; }
.ql-map-live { margin-left: auto; padding: 6px 9px; border-radius: 999px; background: #f1f5f3; font-size: 10px; }
.ql-map-live.online { background: #e8f6f1; }
.ql-map-workspace {
    display: grid; grid-template-columns: minmax(0,1fr) 228px; height: calc(100vh - 390px); min-height: 440px;
    border: 1px solid #ccd9d4; border-top: 0; border-radius: 0 0 12px 12px; overflow: hidden; background: #fff;
}
.ql-map-workspace .ql-map-stage { height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
.ql-map-inspector { padding: 14px; border-left: 1px solid var(--ql-line); background: #fbfcfc; overflow-y: auto; }
.ql-map-inspector-title { margin-bottom: 9px; color: #687771; font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
.ql-map-selection {
    display: flex; min-height: 108px; padding: 15px 12px; align-items: center; justify-content: center;
    flex-direction: column; gap: 5px; border: 1px dashed #cedbd6; border-radius: 11px;
    color: #77857f; background: #fff; text-align: center;
}
.ql-map-selection.has-selection { align-items: flex-start; border-style: solid; border-color: #bfe0d5; background: #eef8f4; text-align: left; }
.ql-map-selection-icon { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; color: var(--ql-brand); background: var(--ql-brand-soft); font-size: 15px; }
.ql-map-selection b { color: #344b43; font: 650 11.5px var(--font-mono); word-break: break-all; }
.ql-map-selection small, .ql-map-selection em { color: #81908a; font-size: 10px; font-style: normal; }
.ql-map-delete-selected { width: 100%; height: 32px; margin-top: 8px; border-radius: 8px; font-size: 11px; }
.ql-map-inspector-divider { height: 1px; margin: 15px 0; background: #e3ebe8; }
.ql-map-inspector .ql-map-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 0; }
.ql-map-inspector .ql-legend-item { font-size: 10.5px; }
.ql-map-tips { display: flex; flex-direction: column; gap: 7px; color: #7b8984; font-size: 10px; }
.ql-map-tips b { margin-bottom: 2px; color: #53655e; font-size: 10px; }
.ql-map-tips span::before { content: "·"; margin-right: 6px; color: var(--ql-brand); }
.ql-map-zoom {
    position: absolute; z-index: 5; right: 14px; bottom: 14px; display: flex; align-items: center; padding: 4px;
    border: 1px solid #d5e0dc; border-radius: 10px; background: rgba(255,255,255,.96); box-shadow: 0 8px 22px rgba(16,35,31,.13);
}
.ql-map-zoom button { width: 30px; height: 29px; padding: 0; border: 0; border-radius: 7px; color: #3d524b; background: transparent; cursor: pointer; font-size: 16px; }
.ql-map-zoom button:hover { color: var(--ql-brand); background: var(--ql-brand-soft); }
.ql-map-zoom span { width: 50px; color: #5f706a; font: 10px var(--font-mono); text-align: center; }
.ql-map-zoom button.fit { width: 38px; margin-left: 3px; border-left: 1px solid #e0e8e5; border-radius: 0 7px 7px 0; font-size: 10px; font-weight: 650; }
.ql-map-empty { gap: 9px; color: #3f554e; background: rgba(246,250,248,.94); pointer-events: auto; }
.ql-map-empty b { font-size: 13px; }
.ql-map-empty .glass-btn { margin-top: 5px; padding: 8px 13px; font-size: 11px; pointer-events: auto; }
.ql-confirm-box, .ql-modal { border: 1px solid #e0e8e5; border-radius: 15px; }
.ql-toast { top: 76px; border-radius: 10px; }
.ql-empty-state { max-width: 360px; text-align: center; }
.ql-empty-icon { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px; color: var(--ql-brand); background: var(--ql-brand-soft); font-size: 24px; }
.ql-empty-title { margin-bottom: 6px; color: #2b403a; font-size: 14px; font-weight: 700; }
.ql-empty-desc { color: #7a8984; font-size: 12px; line-height: 1.7; }

@media (max-width: 1100px) {
    .ql-sider { width: 226px; }
    .ql-content-bottom > div:first-child { grid-template-columns: 1fr !important; }
    .ql-content-bottom { max-height: 360px; }
    .ql-map-workspace { grid-template-columns: minmax(0,1fr) 190px; }
}
@media (max-width: 760px) {
    body { overflow: auto; }
    .ql-topbar { height: 58px; padding: 0 14px; }
    .ql-brand-sub, .ql-clock, .ql-top-divider { display: none; }
    .ql-main { min-height: calc(100vh - 58px); }
    .ql-sider { display: none; }
    .ql-content { overflow: visible; }
    .ql-content-top { padding: 12px; overflow: visible; }
    .ql-dev-header { align-items: flex-start; flex-direction: column; }
    .ql-dev-actions { width: 100%; margin: 4px 0 0; }
    .ql-dev-actions button { flex: 1; }
    .ql-content-bottom { position: static; max-height: none; padding: 12px; }
    .ql-table-wrap { max-height: 55vh; }
    .ql-map-head { align-items: stretch; flex-direction: column; }
    .ql-map-search input { flex: 1; width: auto; }
    .ql-map-live { width: auto; margin-left: 0; }
    .ql-map-toolbar { overflow-x: auto; flex-wrap: nowrap; }
    .ql-map-workspace { display: block; height: 62vh; min-height: 420px; }
    .ql-map-inspector { display: none; }
}

/* ===== 与全站 glass / indigo 设计系统对齐 ===== */
:root {
    --ql-ink: var(--color-text);
    --ql-muted: var(--color-text-muted);
    --ql-line: rgba(99,102,241,.12);
    --ql-panel: rgba(255,255,255,.62);
    --ql-bg: transparent;
    --ql-brand: var(--color-primary);
    --ql-brand-dark: var(--color-primary-dark);
    --ql-brand-soft: rgba(99,102,241,.09);
}
body { background: var(--bg-gradient); background-attachment: fixed; color: var(--color-text); }
.ql-topbar {
    height: 56px; padding: 0 28px; background: rgba(255,255,255,.72);
    border-bottom-color: rgba(99,102,241,.10); box-shadow: 0 1px 0 rgba(255,255,255,.6) inset;
}
.ql-brand-mark {
    display: block; width: auto; height: auto; border-radius: 0; color: var(--color-primary);
    background: none; box-shadow: none; font-size: 20px; font-weight: 800;
}
.ql-logo { color: var(--color-primary); font-size: 16px; font-weight: 700; }
.ql-brand-sub { display: none; }
.ql-top-divider { background: rgba(99,102,241,.12); }
.ql-home-link { color: var(--color-primary); border: 1.5px solid rgba(99,102,241,.25); border-radius: var(--radius-tag); }
.ql-home-link:hover { color: var(--color-primary-dark); background: rgba(99,102,241,.08); }
.ql-conn-badge { border-color: rgba(99,102,241,.14); background: rgba(255,255,255,.55); }
.ql-conn-badge.online { border-color: rgba(16,185,129,.20); background: rgba(16,185,129,.10); color: var(--color-success); }
.ql-sider {
    background: rgba(255,255,255,.46); border-right-color: rgba(99,102,241,.10);
    backdrop-filter: blur(18px) saturate(140%);
}
.ql-sider-title { color: var(--color-text); }
.ql-sider .ql-search input, .ql-map-search input {
    border-color: rgba(99,102,241,.16); background: rgba(255,255,255,.65);
}
.ql-sider .ql-search input:focus, .ql-map-search input:focus {
    border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12);
}
.ql-sider .ql-btns button { border-color: rgba(99,102,241,.24); color: var(--color-primary); background: rgba(255,255,255,.58); }
.ql-sider .ql-btns button:first-child { border-color: transparent; background: var(--gradient-btn); box-shadow: 0 4px 14px rgba(99,102,241,.20); }
.ql-group-title { color: var(--color-text-secondary); }
.ql-group-title:hover, .ql-device:hover { background: rgba(99,102,241,.055); }
.ql-device.active {
    border-color: rgba(99,102,241,.20); background: linear-gradient(135deg,rgba(99,102,241,.11),rgba(139,92,246,.08));
    color: var(--color-primary); box-shadow: 0 3px 10px rgba(99,102,241,.08);
}
.ql-device.active::after { color: var(--color-primary-light); }
.ql-content { background: transparent; }
.ql-dev-header, .ql-panel-card, .ql-content-bottom > div:first-child > div,
.ql-table-wrap, .ql-map-head, .ql-map-inspector {
    border-color: rgba(99,102,241,.10); background: rgba(255,255,255,.62);
    backdrop-filter: blur(18px) saturate(140%); box-shadow: var(--glass-shadow);
}
.ql-dev-title { color: var(--color-text); }
.ql-dev-icon, .ql-empty-icon, .ql-map-selection-icon { color: var(--color-primary); background: rgba(99,102,241,.10); }
.ql-dev-meta span { border-right-color: rgba(99,102,241,.10); }
.ql-task-toggle { border-color: rgba(99,102,241,.22); color: var(--color-primary); background: rgba(255,255,255,.58); }
.btn-connect { background: var(--gradient-btn); box-shadow: 0 4px 14px rgba(99,102,241,.22); }
.btn-connect:hover { background: var(--gradient-btn-hover); }
.btn-disconnect { background: rgba(239,68,68,.09); color: var(--color-error); }
.ql-cap { border-color: rgba(99,102,241,.12); background: rgba(255,255,255,.60); }
.ql-cap .v { color: var(--color-primary); }
.ql-tabs { border-color: rgba(99,102,241,.10); background: rgba(255,255,255,.52); }
.ql-tab:hover { color: var(--color-primary); background: rgba(99,102,241,.07); }
.ql-tab.active { background: var(--gradient-btn); box-shadow: 0 3px 10px rgba(99,102,241,.20); }
.ql-table-toolbar { border-bottom-color: rgba(99,102,241,.10); background: rgba(255,255,255,.66); }
.ql-table-toolbar input { border-color: rgba(99,102,241,.14); background: rgba(255,255,255,.62); }
.ql-table-toolbar .count { background: rgba(99,102,241,.07); color: var(--color-primary); }
.ql-table-wrap th { background: rgba(99,102,241,.055); color: var(--color-text-secondary); }
.ql-table-wrap td { border-bottom-color: rgba(99,102,241,.06); }
.ql-table-wrap tr:nth-child(even) td { background: rgba(99,102,241,.018); }
.ql-table-wrap tr:hover td { background: rgba(99,102,241,.06); }
.ql-content-bottom { border-top-color: rgba(99,102,241,.10); background: rgba(247,247,255,.78); box-shadow: 0 -8px 28px rgba(99,102,241,.045); }
.ql-ops-title, .ql-map-heading strong, .ql-empty-title { color: var(--color-text); }
.ql-ops-item input { border-color: rgba(99,102,241,.14); background: rgba(255,255,255,.68); }
.ql-ops-item input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(99,102,241,.10); }
.ql-field { border-color: rgba(99,102,241,.10); background: rgba(255,255,255,.58); }
.ql-map-toolbar { border-color: rgba(99,102,241,.10); background: rgba(255,255,255,.45); }
.ql-map-toolbar .glass-btn-outline { border-color: rgba(99,102,241,.20); background: rgba(255,255,255,.62); color: var(--color-text-secondary); }
.ql-map-toolbar .glass-btn-outline:hover { border-color: var(--color-primary); color: var(--color-primary); background: rgba(99,102,241,.08); }
.ql-map-toolbar .ql-map-action.is-active { border-color: transparent; background: var(--gradient-btn); box-shadow: 0 3px 10px rgba(99,102,241,.22); }
.ql-map-live { background: rgba(99,102,241,.07); color: var(--color-text-muted); }
.ql-map-live.online { background: rgba(16,185,129,.10); color: var(--color-success); }
.ql-map-workspace { border-color: rgba(99,102,241,.12); background: rgba(255,255,255,.45); box-shadow: var(--glass-shadow); }
.ql-map-inspector { border-left-color: rgba(99,102,241,.10); box-shadow: none; }
.ql-map-selection { border-color: rgba(99,102,241,.20); background: rgba(255,255,255,.55); }
.ql-map-selection.has-selection { border-color: rgba(99,102,241,.24); background: rgba(99,102,241,.07); }
.ql-map-selection b { color: var(--color-text-secondary); }
.ql-map-inspector-divider { background: rgba(99,102,241,.10); }
.ql-map-tips span::before { color: var(--color-primary); }
.ql-map-zoom { border-color: rgba(99,102,241,.18); background: rgba(255,255,255,.88); box-shadow: 0 8px 24px rgba(99,102,241,.14); }
.ql-map-zoom button:hover { color: var(--color-primary); background: rgba(99,102,241,.09); }
.ql-map-zoom button.fit { border-left-color: rgba(99,102,241,.12); }
.ql-map-empty { color: var(--color-text-secondary); background: rgba(245,246,255,.93); }
.ql-modal, .ql-confirm-box { border-color: rgba(99,102,241,.12); background: rgba(255,255,255,.96); }
.ql-toast.ok { background: var(--gradient-btn); }

/* ===== 地图优先：复用快捷任务的数字孪生视觉 ===== */
.ql-map-head {
    border-color: rgba(56,189,248,.16);
    background: linear-gradient(180deg,rgba(15,23,42,.98),rgba(11,18,36,.96));

.ql-map-heading strong { color: #e0f2fe; text-shadow: 0 0 12px rgba(56,189,248,.25); }
.ql-map-heading span { color: rgba(148,163,184,.62); }
.ql-map-search input {
    border-color: rgba(56,189,248,.24); background: rgba(15,23,42,.72); color: #e0f2fe;
}
.ql-map-search input::placeholder { color: rgba(148,163,184,.48); }
.ql-map-search input:focus { border-color: rgba(56,189,248,.65); background: rgba(15,23,42,.92); box-shadow: 0 0 0 3px rgba(56,189,248,.10); }
.ql-map-search button { border-color: rgba(56,189,248,.28); background: rgba(56,189,248,.08); color: #bae6fd; }
.ql-map-toolbar {
    border-color: rgba(56,189,248,.14); background: rgba(10,16,32,.96);
}
.ql-map-direct-hint {
    display:flex; align-items:center; gap:9px; min-height:32px; padding:0 4px;
    color:rgba(186,230,253,.72); font-size:12px; white-space:nowrap;
}
.ql-map-direct-hint span { color:rgba(56,189,248,.42); }
.ql-map-toolbar .glass-btn-outline {
    border-color: rgba(56,189,248,.20); background: rgba(15,23,42,.78); color: rgba(186,230,253,.78);
}
.ql-map-toolbar .glass-btn-outline:hover { border-color: rgba(56,189,248,.58); background: rgba(56,189,248,.12); color: #e0f2fe; }
.ql-map-toolbar .ql-map-action.is-active {
    border-color: transparent; background: linear-gradient(135deg,#0891b2,#4f46e5); box-shadow: 0 3px 14px rgba(56,189,248,.25);
}

/* ===== 堆垛机数字化操作台 ===== */
.crane-console {
    --crane-cyan:#38bdf8; --crane-blue:#6366f1; --crane-green:#22c55e;
    --crane-amber:#f59e0b; --crane-red:#ef4444; --crane-dark:#091225;
    overflow:hidden; border:1px solid rgba(99,102,241,.13); border-radius:16px;
    background:rgba(255,255,255,.66); box-shadow:var(--glass-shadow); backdrop-filter:blur(18px) saturate(140%);
}
.crane-console-head {
    display:flex; min-height:58px; padding:12px 16px; align-items:center; justify-content:space-between; gap:16px;
    border-bottom:1px solid rgba(99,102,241,.09); background:linear-gradient(90deg,rgba(99,102,241,.055),rgba(56,189,248,.025));
}
.crane-console-title { display:flex; align-items:center; gap:11px; }
.crane-console-title > div { display:flex; flex-direction:column; gap:2px; }
.crane-console-title b { color:var(--color-text); font-size:14px; font-weight:750; }
.crane-console-title small { color:var(--color-text-muted); font:9px var(--font-mono); letter-spacing:.12em; }
.crane-live-mark {
    display:grid; width:34px; height:34px; place-items:center; border-radius:10px;
    color:var(--crane-cyan); background:linear-gradient(145deg,rgba(56,189,248,.14),rgba(99,102,241,.12));
}
.crane-live-mark i { width:9px; height:9px; border:2px solid currentColor; border-radius:50%; box-shadow:0 0 0 5px rgba(56,189,248,.08); }
.crane-console.is-running .crane-live-mark { color:var(--crane-green); }
.crane-console.is-running .crane-live-mark i { animation:craneLivePulse 1.8s ease-in-out infinite; }
.crane-console-refresh { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.crane-console-refresh span { color:var(--color-text-muted); font-size:9px; }
.crane-console-refresh b { color:var(--color-text-secondary); font:10px var(--font-mono); }
.crane-status-ribbon {

    border-bottom:1px solid rgba(99,102,241,.09); background:rgba(99,102,241,.08);

.crane-data-item {

}
.crane-data-item .k { color:var(--color-text-muted); font-size:10px; white-space:nowrap; }
.crane-data-item .v { overflow:hidden; color:var(--color-text); font:650 11px var(--font-mono); text-overflow:ellipsis; white-space:nowrap; }
.crane-status-ribbon .crane-data-item { min-height:54px; padding:9px 13px; flex-direction:column; align-items:flex-start; justify-content:center; }
.crane-status-ribbon .crane-data-item .v { font-size:12px; }
.crane-data-item.success .v { color:#059669; }
.crane-data-item.warn .v { color:#d97706; }
.crane-data-item.alarm .v { color:#dc2626; }
.crane-status-ribbon .crane-primary-state { box-shadow:inset 3px 0 0 var(--crane-blue); }
.crane-status-ribbon .crane-primary-state.success { box-shadow:inset 3px 0 0 var(--crane-green); }
.crane-status-ribbon .crane-primary-state.warn { box-shadow:inset 3px 0 0 var(--crane-amber); }
.crane-status-ribbon .crane-primary-state.alarm,
.crane-status-ribbon .crane-alarm-state.alarm { background:rgba(254,242,242,.92); box-shadow:inset 3px 0 0 var(--crane-red); }
.crane-machine-status {
    border-bottom-color:rgba(56,189,248,.13); background:rgba(56,189,248,.09);
}
.crane-machine-status .crane-data-item {
    min-height:48px; padding:8px 11px; border-right:1px solid rgba(56,189,248,.08);
    background:linear-gradient(180deg,rgba(15,31,56,.96),rgba(10,22,42,.96));
}
.crane-machine-status .crane-data-item:last-child { border-right:0; }

.crane-machine-status .crane-data-item .v { color:#e0f2fe; font-size:10.5px; }
.crane-machine-status .crane-data-item.success .v { color:#6ee7b7; }
.crane-machine-status .crane-data-item.warn .v { color:#fde68a; }
.crane-machine-status .crane-data-item.alarm .v { color:#fca5a5; }
.crane-machine-status .crane-primary-state { box-shadow:inset 3px 0 0 var(--crane-blue); }
.crane-machine-status .crane-primary-state.success { box-shadow:inset 3px 0 0 var(--crane-green); }

.crane-console-body { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(240px,.58fr); gap:12px; padding:12px; }
.crane-machine-panel, .crane-detail-panel {

.crane-machine-layout { display:grid; min-height:276px; grid-template-columns:190px minmax(280px,1fr) 190px; }
.crane-machine-view {
    position:relative; height:100%; min-height:276px; overflow:hidden; border-right:1px solid rgba(56,189,248,.10); border-left:1px solid rgba(56,189,248,.10); background:
        radial-gradient(circle at 50% 48%,rgba(56,189,248,.10),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(99,102,241,.13),transparent 35%),
        linear-gradient(rgba(56,189,248,.035) 1px,transparent 1px),

}
.crane-rail { position:absolute; left:4%; right:4%; height:3px; border-radius:3px; background:linear-gradient(90deg,transparent,#334b69 7%,#38bdf8 50%,#334b69 93%,transparent); }
.crane-rail::after { content:""; position:absolute; inset:-4px 0; background:linear-gradient(90deg,transparent,rgba(56,189,248,.15),transparent); filter:blur(5px); }
.crane-rail-top { top:18px; }
.crane-rail-bottom { bottom:18px; }
.crane-rack {

.crane-rack-columns span { overflow:hidden; color:#64748b; font:6.5px var(--font-mono); text-align:center; text-overflow:clip; white-space:nowrap; }

.crane-rack-grid i span { color:transparent; font:650 6.5px var(--font-mono); }

.crane-rack-grid i.is-current-position span { position:absolute; right:2px; bottom:1px; color:#cffafe; }
.crane-rack-levels { position:absolute; top:31px; right:3px; bottom:7px; display:grid; width:17px; grid-template-rows:repeat(5,1fr); }

.crane-aisle-label {

.crane-mast { position:absolute; top:20px; bottom:20px; left:50%; width:116px; transform:translateX(-50%); }

.crane-detail-panel { align-self:stretch; }
/* 右面板与巷道视图等高：结果行均分高度、报警条落底，避免下方留白 */
.crane-detail-panel .crane-result-block .crane-data-item { flex:1; min-height:44px; }

/* ===== 重点强化：克制版。用状态圆点 + 文字色分级，常态安静，异常才抢眼 ===== */
/* 数值温和放大到 13px，主状态 15px，拉开层级但不喧闹 */
.crane-machine-status .crane-data-item { min-height:52px; padding:8px 12px; gap:5px; }
.crane-machine-status .crane-data-item .k { font-size:8.5px; letter-spacing:.04em; color:rgba(148,163,184,.6); }
.crane-machine-status .crane-data-item .v { font-size:13px; font-weight:700; transition:color .25s ease; }

/* 主状态（工作模式）：数值前置一个发光圆点表达"活着"，字号略大 */
.crane-machine-status .crane-primary-state .v {
    position:relative; padding-left:15px; font-size:15px;
}
.crane-machine-status .crane-primary-state .v::before {
    content:""; position:absolute; left:0; top:50%; width:8px; height:8px; transform:translateY(-50%);
    border-radius:50%; background:#64748b; box-shadow:0 0 0 3px rgba(100,116,139,.14);
}
.crane-machine-status .crane-primary-state { box-shadow:inset 3px 0 0 rgba(100,116,139,.5); }

/* 运行：绿点缓慢呼吸，文字轻微染绿，不铺满格 */
.crane-machine-status .crane-primary-state.success { box-shadow:inset 3px 0 0 var(--crane-green); }
.crane-machine-status .crane-primary-state.success .v { color:#6ee7b7; }
.crane-machine-status .crane-primary-state.success .v::before {
    background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.16),0 0 10px rgba(34,197,94,.6);
    animation:craneDotBreath 2.4s ease-in-out infinite;
}
/* 待机：黄点静止 */
.crane-machine-status .crane-primary-state.warn { box-shadow:inset 3px 0 0 var(--crane-amber); }
.crane-machine-status .crane-primary-state.warn .v { color:#fbbf24; }
.crane-machine-status .crane-primary-state.warn .v::before { background:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.16); }

/* 其它字段仅文字染色，保持安静 */
.crane-machine-status .crane-data-item.success .v { color:#6ee7b7; }
.crane-machine-status .crane-data-item.warn .v { color:#fbbf24; }

/* 报警是唯一的"异常态"，给它全部的强调预算：填充 + 红点脉冲 */
.crane-machine-status .crane-primary-state.alarm .v::before {
    background:#ef4444; box-shadow:0 0 0 3px rgba(239,68,68,.2),0 0 10px rgba(239,68,68,.7);
    animation:craneDotAlarm 1s ease-in-out infinite;
}
.crane-machine-status .crane-data-item.alarm {
    background:linear-gradient(180deg,rgba(120,20,30,.5),rgba(60,12,18,.85));
}
.crane-machine-status .crane-data-item.alarm .v { color:#ff8080; }
.crane-machine-status .crane-primary-state.alarm,
.crane-machine-status .crane-alarm-state.alarm { box-shadow:inset 3px 0 0 var(--crane-red); }

/* 设备大状态：只有报警时才让外缘发红呼吸；运行只给一条极淡的绿边 */
.crane-console.is-running { border-color:rgba(34,197,94,.2); }
.crane-console.has-alarm {
    border-color:rgba(239,68,68,.45);
    box-shadow:0 0 0 1px rgba(239,68,68,.2),0 0 22px rgba(239,68,68,.12),var(--glass-shadow);
    animation:craneConsoleAlarm 1.6s ease-in-out infinite;
}
.crane-console.has-alarm .crane-console-head { background:linear-gradient(90deg,rgba(239,68,68,.1),rgba(239,68,68,.02)); }

@keyframes craneDotBreath {
    0%,100% { box-shadow:0 0 0 3px rgba(34,197,94,.16),0 0 8px rgba(34,197,94,.5); }
    50% { box-shadow:0 0 0 4px rgba(34,197,94,.22),0 0 14px rgba(34,197,94,.85); }
}
@keyframes craneDotAlarm {
    0%,100% { box-shadow:0 0 0 3px rgba(239,68,68,.2),0 0 8px rgba(239,68,68,.6); opacity:1; }
    50% { box-shadow:0 0 0 5px rgba(239,68,68,.3),0 0 16px rgba(239,68,68,.95); opacity:.75; }
}
@keyframes craneConsoleAlarm {
    0%,100% { box-shadow:0 0 0 1px rgba(239,68,68,.2),0 0 22px rgba(239,68,68,.1),var(--glass-shadow); }
    50% { box-shadow:0 0 0 1px rgba(239,68,68,.38),0 0 34px rgba(239,68,68,.24),var(--glass-shadow); }
}
@keyframes craneLivePulse { 50% { box-shadow:0 0 0 7px rgba(34,197,94,.04),0 0 14px rgba(34,197,94,.35); } }
@keyframes craneAlarmPulse { 50% { transform:scale(.92); opacity:.72; } }
@keyframes craneForkMove { 50% { transform:scaleX(1.18); } }
@keyframes craneTravelSweep { from { left:5%; opacity:.2; } to { left:77%; opacity:1; } }
@keyframes craneTravelSweepReverse { from { left:77%; opacity:.2; } to { left:5%; opacity:1; } }
@keyframes craneMastForward {
    0% { transform:translateX(calc(-50% - 13px)); }
    65% { transform:translateX(calc(-50% + 10px)); }
    100% { transform:translateX(-50%); }
}
@keyframes craneMastReverse {
    0% { transform:translateX(calc(-50% + 13px)); }
    65% { transform:translateX(calc(-50% - 10px)); }
    100% { transform:translateX(-50%); }
}
@keyframes craneCarriageUp {
    0% { transform:translate(-50%,calc(-50% + 18px)); }
    70% { transform:translate(-50%,calc(-50% - 8px)); }
    100% { transform:translate(-50%,-50%); }
}
@keyframes craneCarriageDown {
    0% { transform:translate(-50%,calc(-50% - 18px)); }
    70% { transform:translate(-50%,calc(-50% + 8px)); }
    100% { transform:translate(-50%,-50%); }
}
@media (prefers-reduced-motion:reduce) {
    .crane-live-mark i,.crane-alarm-banner.active .crane-alarm-icon,.crane-fork-beam.active i,
    .crane-machine-view::after,.crane-machine-view .crane-mast,.crane-machine-view .crane-carriage,
    .crane-machine-status .crane-primary-state.success .v::before,
    .crane-machine-status .crane-primary-state.alarm .v::before,
    .crane-console.has-alarm { animation:none; }
}
@media (max-width:1200px) {
    .crane-status-ribbon { grid-template-columns:repeat(3,1fr); }
    .crane-console-body { grid-template-columns:1fr; }
    .crane-detail-panel { min-height:230px; }
    .crane-result-block { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
    .crane-machine-layout { grid-template-columns:180px minmax(260px,1fr) 180px; }
    .crane-task-layout { grid-template-columns:1fr; }
    .crane-task-route { border-right:0; border-bottom:1px solid rgba(99,102,241,.10); }
    .crane-command-deck .crane-task-route { border-bottom-color:rgba(56,189,248,.10); }
    .crane-command-deck .crane-task-action { border-left:0; }
}
@media (max-width:760px) {
    .crane-status-ribbon { grid-template-columns:repeat(2,1fr); }
    .crane-console-body { padding:8px; }
    .crane-axis-values { display:none; }
    .crane-machine-layout { display:flex; flex-direction:column; }
    .crane-machine-view { min-height:300px; border-right:0; border-left:0; border-top:1px solid rgba(56,189,248,.10); border-bottom:1px solid rgba(56,189,248,.10); }
    .crane-fork-monitor-data { display:grid; grid-template-columns:repeat(2,1fr); gap:0 12px; }
    .crane-rack { width:34%; }
    .crane-forks { grid-template-columns:1fr; padding:0 8px 8px; }
    .crane-fork-data { grid-template-columns:repeat(2,1fr); }
    .crane-task-head { align-items:flex-start; flex-direction:column; }
    .crane-position-flow,.crane-position-flow.single { grid-template-columns:1fr; }
    .crane-route-arrow { padding:2px 0; }
    .crane-route-arrow i { width:2px; height:22px; background:linear-gradient(rgba(16,185,129,.45),var(--color-primary),rgba(244,63,94,.55)); }
    .crane-route-arrow i::after { right:auto; left:50%; top:auto; bottom:-1px; transform:translateX(-50%) rotate(135deg); }
    .crane-task-meta-grid { grid-template-columns:repeat(2,1fr); }
    .crane-clear-task { align-items:stretch; flex-direction:column; }
    .crane-clear-action { width:100%; }
}
@media (min-width: 1101px) { .ql-content-bottom:not(.is-collapsed) { max-height: 330px; } }
@media (max-width: 1100px) { .ql-map-workspace { height: calc(100vh - 350px); min-height: 500px; } }

/* ============================================================
   阶段一 · 统一深色控制室主题（仅重着色，不改布局/结构）
   通过覆盖设计变量 + 浅色表面，把"浅玻璃外壳 + 深色内панel"
   统一成一套深空蓝控制台视觉。
   ============================================================ */
:root {
    --color-text:#e9f0ff;
    --color-text-secondary:#aab8d6;
    --color-text-muted:#6c7c9e;
    --color-primary:#38bdf8;
    --color-primary-light:#7dd3fc;
    --color-primary-dark:#0ea5e9;
    --glass-bg:rgba(18,28,50,.62);
    --glass-bg-hover:rgba(26,38,66,.76);
    --glass-border:1px solid rgba(96,165,250,.16);
    --glass-blur:blur(18px) saturate(140%);
    --glass-shadow:0 10px 30px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.04) inset;
    --glass-shadow-hover:0 16px 40px rgba(0,0,0,.46),0 1px 0 rgba(255,255,255,.05) inset;
    /* 同步重定向 2026 主题令牌，兜底残留的浅色引用 */
    --ql-ink:#e9f0ff; --ql-muted:#8595b5; --ql-line:rgba(56,189,248,.12);
    --ql-panel:rgba(18,28,50,.55); --ql-bg:transparent;
    --ql-brand:#22d3ee; --ql-brand-dark:#0ea5e9; --ql-brand-soft:rgba(56,189,248,.12);
}
body {
    color:var(--color-text);
    background:
        radial-gradient(1200px 620px at 10% -12%, rgba(56,189,248,.12), transparent 60%),
        radial-gradient(1100px 720px at 112% 8%, rgba(99,102,241,.14), transparent 55%),
        radial-gradient(900px 900px at 50% 120%, rgba(14,165,233,.08), transparent 60%),
        linear-gradient(180deg,#070c18 0%,#0a1122 55%,#080e1c 100%);
    background-attachment:fixed;
}

/* 顶栏 */
.glass-topbar, .ql-topbar {
    background:rgba(10,17,34,.72); backdrop-filter:blur(20px) saturate(160%);
    border-bottom:1px solid rgba(56,189,248,.12); box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.ql-brand-sub { color:var(--color-text-muted); }
.ql-conn-badge { background:rgba(56,189,248,.08); color:var(--color-text-muted); }
.ql-conn-badge.online { background:rgba(16,185,129,.14); color:#34d399; }
.ql-clock { color:var(--color-text-secondary); }
.ql-home-link { color:var(--color-text-muted); }
.ql-home-link:hover { color:var(--color-primary-light); }

/* 左侧设备栏 */
.ql-sider { background:rgba(12,19,38,.6); backdrop-filter:blur(14px); border-right:1px solid rgba(56,189,248,.10); }
.ql-group-title { color:var(--color-text-secondary); }
.ql-group-title:hover { background:rgba(56,189,248,.06); }
.ql-device { color:var(--color-text-secondary); }
.ql-device:hover { background:rgba(56,189,248,.08); }
.ql-device.active { background:rgba(56,189,248,.14); color:var(--color-primary-light); }
.ql-device .dev-dot { background:#3b4a68; }
.ql-device .dev-dot.on { background:#34d399; box-shadow:0 0 8px rgba(52,211,153,.6); }
.ql-device-drag { color:#64748b; }
.ql-device:hover .ql-device-drag { color:#7dd3fc; background:rgba(56,189,248,.08); }

/* 内容分割区 */
.ql-content-bottom { background:rgba(12,19,38,.72); backdrop-filter:blur(10px); border-top:1px solid rgba(56,189,248,.10); }

/* 设备头部 */
.ql-dev-meta { color:var(--color-text-muted); }

/* 通用输入 / 次级按钮 翻深色 */
.glass-input { background:rgba(10,18,36,.7); border:1.5px solid rgba(56,189,248,.18); color:var(--color-text); }
.glass-input::placeholder { color:var(--color-text-muted); }
.glass-input:hover { border-color:rgba(56,189,248,.32); }
.glass-input:focus { background:rgba(10,18,36,.92); border-color:var(--color-primary); box-shadow:0 0 0 3px rgba(56,189,248,.16); }
.glass-btn-outline { background:rgba(56,189,248,.08); color:var(--color-primary-light); border:1.5px solid rgba(56,189,248,.28); }
.glass-btn-outline:hover { background:rgba(56,189,248,.16); border-color:var(--color-primary); color:#bae6fd; }

/* 通用字段卡 / 表格 翻深色（供非堆垛机设备类型页面复用） */
.ql-field { background:rgba(18,28,50,.5); border:1px solid rgba(56,189,248,.1); }
.ql-field .k { color:var(--color-text-secondary); }
.ql-field .v { color:var(--color-text); }
.ql-table-wrap { border:1px solid rgba(56,189,248,.1); background:rgba(11,18,35,.66) !important; backdrop-filter:none !important; box-shadow:none !important; }
.ql-table-wrap th { background:rgba(15,23,42,.96); color:var(--color-text-secondary); border-bottom:1px solid rgba(56,189,248,.12); }
.ql-table-wrap td { color:var(--color-text); border-bottom:1px solid rgba(56,189,248,.06); }
.ql-table-wrap tr:nth-child(even) td { background:rgba(255,255,255,.02); }
.ql-table-wrap tr:hover td { background:rgba(56,189,248,.06); }
/* Tab 采用 indigo 胶囊样式，只把容器底翻深，激活态渐变保留 */
.ql-tabs { border:1px solid rgba(56,189,248,.12); background:rgba(12,19,38,.6); }
.ql-tab { color:var(--color-text-muted); }
.ql-tab:hover { color:var(--color-primary-light); background:rgba(56,189,248,.08); }
.empty-hint { background:rgba(18,28,50,.4); border:1px dashed rgba(56,189,248,.2); color:var(--color-text-muted); }

/* 补全：设备头 / 面板卡 / 下方任务卡 / 能力条 / 工具栏 / 侧栏输入按钮 等硬编码白底翻深 */
.ql-dev-header, .ql-panel-card, .ql-content-bottom > div:first-child > div {
    border-color:rgba(56,189,248,.12);
    background:linear-gradient(160deg,rgba(16,25,46,.72),rgba(11,18,35,.78));
    backdrop-filter:blur(18px) saturate(140%); box-shadow:0 10px 28px rgba(0,0,0,.32);
}
.ql-dev-title { color:var(--color-text); }
.ql-dev-icon { color:var(--color-primary-light); background:rgba(56,189,248,.12); }
.ql-dev-state { background:rgba(56,189,248,.1); color:var(--color-text-secondary); }
.ql-dev-state.online { background:rgba(16,185,129,.16); color:#34d399; }
.ql-dev-meta span { border-right-color:rgba(56,189,248,.12); }
.ql-task-toggle { border-color:rgba(56,189,248,.24); color:var(--color-primary-light); background:rgba(56,189,248,.08); }
.ql-cap { border-color:rgba(56,189,248,.12); background:rgba(18,28,50,.5); }
.ql-cap .v { color:var(--color-primary-light); }
.ql-sider-title { color:var(--color-text); }
.ql-sider-total, .ql-site-label, .ql-site-tab small { color:var(--color-text-muted); }
.ql-sider .ql-search input, .ql-map-search input { border-color:rgba(56,189,248,.18); background:rgba(10,18,36,.7); color:var(--color-text); }
.ql-sider .ql-search input:focus { border-color:var(--color-primary); box-shadow:0 0 0 3px rgba(56,189,248,.14); }
.ql-sider .ql-btns button { border-color:rgba(56,189,248,.24); color:var(--color-primary-light); background:rgba(56,189,248,.06); }
.ql-site-tab { border-color:rgba(56,189,248,.16); color:var(--color-text-secondary); background:rgba(18,28,50,.5); box-shadow:none; }
.ql-site-add { color:var(--color-primary-light); background:rgba(56,189,248,.06); }
.ql-table-toolbar { border-bottom-color:rgba(56,189,248,.12); background:rgba(12,19,38,.7); }
.ql-table-toolbar input { border-color:rgba(56,189,248,.14); background:rgba(10,18,36,.66); color:var(--color-text); }
.ql-table-toolbar .count { background:rgba(56,189,248,.08); color:var(--color-primary-light); }
.ql-ops-title { color:var(--color-text); }
.ql-ops-item input { border-color:rgba(56,189,248,.14); background:rgba(10,18,36,.68); color:var(--color-text); }
.ql-ops-item input:focus { border-color:var(--color-primary); box-shadow:0 0 0 3px rgba(56,189,248,.12); }
.ql-route-preview { color:#9db2ff; background:rgba(56,189,248,.06); }
.ql-route-picker { border-color:rgba(56,189,248,.14); background:rgba(56,189,248,.045); }

/* 弹窗 / 确认框 翻深色，避免深色页面上跳出白色卡片 */
.ql-confirm-box, .ql-modal, .glass-modal { background:rgba(16,24,44,.96); color:var(--color-text); border:1px solid rgba(56,189,248,.14); box-shadow:0 24px 64px rgba(0,0,0,.55); }
.ql-confirm-box p, .ql-modal p { color:var(--color-text-secondary); }

/* —— 核心：堆垛机操作台外壳翻深色，消除浅玻璃外壳与深色内panel的割裂 —— */
.crane-console {
    border:1px solid rgba(56,189,248,.18);
    background:linear-gradient(160deg,rgba(13,21,42,.86),rgba(8,14,28,.9));
    box-shadow:0 18px 44px rgba(0,0,0,.4),0 0 0 1px rgba(56,189,248,.05) inset;
    backdrop-filter:blur(18px) saturate(140%);
}
.crane-console-head {
    border-bottom:1px solid rgba(56,189,248,.12);
    background:linear-gradient(90deg,rgba(56,189,248,.09),rgba(99,102,241,.04));
}
.crane-console-title b { color:#e9f0ff; }
.crane-console-title small { color:var(--color-text-muted); }
.crane-console-refresh span { color:var(--color-text-muted); }
.crane-console-refresh b { color:var(--color-text-secondary); }

/* ============================================================
   阶段二 · 数据可视化：任务阶段进度带 / 脉冲趋势线 / 货叉状态灯
   ============================================================ */
/* 任务阶段进度带 */
.crane-phase-track {
    display:flex; align-items:center; gap:0; padding:10px 16px;
    border-bottom:1px solid rgba(56,189,248,.09); background:rgba(8,14,28,.45);
}
.crane-phase-step { display:flex; flex:1; align-items:center; gap:7px; color:#5b6b8c; font-size:10.5px; white-space:nowrap; transition:color .3s; }
.crane-phase-step:last-child { flex:0 0 auto; }
.crane-phase-step > i {
    width:10px; height:10px; flex:0 0 auto; border:1.5px solid currentColor; border-radius:50%;
    background:transparent; transition:background .3s, box-shadow .3s, border-color .3s;
}
.crane-phase-step > span { flex:0 0 auto; }
.crane-phase-step::after { content:""; flex:1; height:1px; min-width:16px; margin:0 9px; background:currentColor; opacity:.22; }
.crane-phase-step:last-child::after { display:none; }
.crane-phase-step.is-done { color:#34d399; }
.crane-phase-step.is-done > i { background:#22c55e; border-color:#22c55e; box-shadow:0 0 8px rgba(34,197,94,.5); }
.crane-phase-step.is-active { color:#7dd3fc; font-weight:750; }
.crane-phase-step.is-active > i {
    background:#38bdf8; border-color:#bae6fd;
    box-shadow:0 0 0 3px rgba(56,189,248,.18),0 0 12px rgba(56,189,248,.75);
    animation:cranePhasePulse 1.6s ease-in-out infinite;
}
@keyframes cranePhasePulse { 50% { box-shadow:0 0 0 5px rgba(56,189,248,.1),0 0 16px rgba(56,189,248,.95); } }

/* 脉冲趋势线 sparkline */
.crane-axis-values span { position:relative; }
.crane-spark { display:block; width:54px; height:16px; opacity:.85; }
.crane-axis-values span.active .crane-spark { opacity:1; }

/* 货叉状态灯：给已着色的字段值加发光圆点，一眼看状态 */
.crane-fork-monitor-data .crane-data-item .v { display:inline-flex; align-items:center; }
.crane-fork-monitor-data .crane-data-item.success .v::before,
.crane-fork-monitor-data .crane-data-item.warn .v::before,
.crane-fork-monitor-data .crane-data-item.alarm .v::before {
    content:""; display:inline-block; width:6px; height:6px; margin-right:6px; border-radius:50%; flex:0 0 auto;
}
.crane-fork-monitor-data .crane-data-item.success .v::before { background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,.65); }
.crane-fork-monitor-data .crane-data-item.warn .v::before { background:#f59e0b; box-shadow:0 0 6px rgba(245,158,11,.55); }
.crane-fork-monitor-data .crane-data-item.alarm .v::before { background:#ef4444; box-shadow:0 0 6px rgba(239,68,68,.65); }

/* ============================================================
   阶段三 · 强化主角 + 微交互：数值变化闪烁 / 巷道视图纵深质感
   ============================================================ */
/* 数值变化闪烁（count-up 同时触发） */
.crane-flash-anim { animation:craneValueFlash .6s ease-out; }
@keyframes craneValueFlash {
    0% { color:#ffffff; text-shadow:0 0 14px rgba(56,189,248,.95); }
    100% { text-shadow:0 0 0 rgba(56,189,248,0); }
}

/* 巷道视图：加深景深、导轨更亮、极淡环境扫描光 */
.crane-machine-view {
    box-shadow:inset 0 0 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(56,189,248,.06);
}
.crane-machine-view::before {
    content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(56,189,248,.045) 50%, transparent 100%);
    background-size:100% 46%;
    animation:craneAmbientScan 7s linear infinite; opacity:.6;
}
.crane-rail { height:4px; background:linear-gradient(90deg,transparent,#3a5a80 6%,#7dd3fc 50%,#3a5a80 94%,transparent); }
.crane-rail::after { filter:blur(6px); background:linear-gradient(90deg,transparent,rgba(56,189,248,.28),transparent); }

/* 载货台：金属光泽 + 定位后聚光 */
.crane-carriage {
    background:linear-gradient(155deg,rgba(41,72,116,.98),rgba(15,23,42,.99) 60%),
               linear-gradient(0deg,rgba(125,211,252,.06),rgba(125,211,252,.06));
}
.crane-carriage.is-positioned {
    border-color:rgba(125,211,252,.85);
    box-shadow:0 0 0 1px rgba(56,189,248,.2) inset, 0 0 34px rgba(56,189,248,.34), 0 10px 26px rgba(0,0,0,.45);
}
.crane-console.is-running .crane-carriage.is-positioned { border-color:rgba(52,245,176,.7); box-shadow:0 0 0 1px rgba(52,245,176,.18) inset,0 0 34px rgba(34,197,94,.3),0 10px 26px rgba(0,0,0,.45); }

/* 坐标读数：更醒目的玻璃卡 */
.crane-coordinate-readout, .crane-task-tag { background:rgba(6,12,26,.9); box-shadow:0 6px 18px rgba(0,0,0,.4); }

@keyframes craneAmbientScan { 0% { background-position:0 -46%; } 100% { background-position:0 146%; } }
@media (prefers-reduced-motion:reduce) { .crane-machine-view::before { animation:none; opacity:0; } }

/* ============================================================
   输送线地图 · 在深色页面中重建"发光监控屏"的图底关系
   ============================================================ */
/* 顶部标题条：明确的屏首，左侧霓虹竖条 */
.ql-map-head {
    position:relative; border-radius:14px 14px 0 0;
    background:linear-gradient(180deg,rgba(17,27,50,.98),rgba(11,18,36,.98));
    border-color:rgba(56,189,248,.26); border-bottom:0;
    box-shadow:0 -1px 0 rgba(125,211,252,.12) inset;
}
.ql-map-head::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,#38bdf8,#6366f1);
    box-shadow:0 0 12px rgba(56,189,248,.55);
}
.ql-map-heading strong { letter-spacing:.01em; }

/* 工具栏：与屏首、画布同属一块屏，左右边框收拢 */
.ql-map-toolbar { border-left-color:rgba(56,189,248,.26); border-right-color:rgba(56,189,248,.26); }

/* 画布工作区：作为一块嵌入深色台面的发光屏幕 */
.ql-map-workspace {
    border:1px solid rgba(56,189,248,.3); border-top:0;
    box-shadow:
        0 0 0 1px rgba(56,189,248,.05),
        0 26px 56px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(125,211,252,.16),
        inset 0 0 70px rgba(56,189,248,.05);
}
/* 侧栏检查器：清晰的分隔与轻微内发光，读作屏的一部分 */
.ql-map-inspector {
    border-left:1px solid rgba(56,189,248,.22);
    box-shadow:inset 12px 0 24px rgba(0,0,0,.28);
}
.ql-map-inspector-title {
    padding-left:11px; position:relative;
}
.ql-map-inspector-title::before {
    content:""; position:absolute; left:0; top:50%; width:3px; height:11px; transform:translateY(-50%);
    border-radius:2px; background:#38bdf8; box-shadow:0 0 8px rgba(56,189,248,.6);
}
/* 在线状态徽标：连接时发光，强化"实时" */
.ql-map-live.online { box-shadow:0 0 0 1px rgba(16,185,129,.3),0 0 14px rgba(16,185,129,.22); }
/* 当前选择的点位详情卡：更明确的卡片 + 任务信息高亮 */
.ql-map-selection.has-selection { box-shadow:0 8px 22px rgba(0,0,0,.32); }
.ql-map-state-grid .is-task, .ql-map-task-delete { font-weight:750; }

/* 图例与新语义分级对齐：空闲退为暗灰蓝，任务/报警才亮 */
.ql-legend-idle { background:#3a4a66 !important; box-shadow:none !important; }
.ql-legend-load { background:#10b981 !important; box-shadow:0 0 6px rgba(16,185,129,.5) !important; }
.ql-legend-task { background:#f59e0b !important; box-shadow:0 0 7px rgba(245,158,11,.6) !important; }
.ql-legend-alarm { background:#fb4f64 !important; box-shadow:0 0 7px rgba(251,79,100,.6) !important; }

/* KPI 概览徽章（地图头右侧）：客户一眼看整线健康度 */
.ql-map-live { display:flex; align-items:center; gap:6px; padding:0 !important; background:transparent !important; border:0 !important; box-shadow:none !important; }
.cv-kpi { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border:1px solid rgba(56,189,248,.18); border-radius:8px; background:rgba(56,189,248,.06); color:var(--color-text-secondary); font-size:10.5px; white-space:nowrap; }
.cv-kpi em { color:rgba(148,163,184,.7); font-style:normal; }

<script>if (sessionStorage.getItem('wcs_logged_in') !== 'true') window.location.replace('login.html');</script>

            <div class="ql-site-head"><span class="ql-site-label">调试现场</span><button class="ql-site-manage" onclick="openSiteManager()">管理现场</button></div>

        </div>
