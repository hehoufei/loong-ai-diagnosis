<div class="ql-toast" id="toast"></div>
<div id="confirmRoot"></div>

<script>
const API = '/api/v1/ql-tool';
const state = {
    devices: [], deviceGroups: [], sites: [], activeSite: localStorage.getItem('ql_active_site') || '',
    current: null, settings: { pollIntervalMs: 1000 }, pollTimer: null, opsPanelOpen: false
};

function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = (ok ? '✓ ' : '✕ ') + msg;
    t.className = 'ql-toast show ' + (ok ? 'ok' : 'err');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = 'ql-toast'; }, 2600);
}
async function api(path, opts) {
    const res = await fetch(API + path, opts);
    const json = await res.json();
    if (!json.success) throw new Error(json.message || '请求失败');
    return json.data;
}
function qlConfirm(title, desc) {
    return new Promise(resolve => {
        const root = document.getElementById('confirmRoot');
        root.innerHTML = `<div class="ql-confirm-overlay" onclick="this.parentElement.innerHTML=''"><div class="ql-confirm-box" onclick="event.stopPropagation()"><h3>${title}</h3><p>${desc}</p><div class="ql-confirm-btns"><button class="glass-btn-outline" id="cfmNo">取消</button><button class="glass-btn btn-connect" id="cfmYes">确认</button></div></div></div>`;
        root.querySelector('#cfmNo').onclick = () => { root.innerHTML = ''; resolve(false); };
        root.querySelector('#cfmYes').onclick = () => { root.innerHTML = ''; resolve(true); };
    });
}

// ===== 设备树 =====
async function loadDeviceTree() {
    try {
        const [groups, sites] = await Promise.all([api('/devices'), api('/sites')]);
        state.deviceGroups = groups || [];
        state.sites = sites || [];
        state.devices = groups.flatMap(g => g.devices);
        if (!state.sites.some(site => site.siteName === state.activeSite)) {
            state.activeSite = state.sites.length ? state.sites[0].siteName : '';
        }
        if (state.activeSite) localStorage.setItem('ql_active_site', state.activeSite);
        renderSiteTabs();
        renderTree(state.deviceGroups);
    } catch (e) { document.getElementById('deviceTreeContent').innerHTML = `<div class="empty-hint">${e.message}</div>`; }
}
function renderSiteTabs() {
    const root = document.getElementById('siteTabs');
    if (!root) return;
    root.innerHTML = state.sites.map(site => {
        const encoded = encodeURIComponent(site.siteName);
        return `<button class="ql-site-tab ${site.siteName===state.activeSite?'active':''}" onclick="setActiveSite(decodeURIComponent('${encoded}'))"><strong>${site.siteName}</strong><small>${site.stackerCount} 台堆垛机 · ${site.conveyorCount} 台输送线</small></button>`;
    }).join('') + `<button class="ql-site-tab ql-site-add" onclick="openSiteManager(true)" title="新建现场">＋</button>`;
}
function setActiveSite(siteName) {
    if (!siteName || siteName === state.activeSite) return;
    state.activeSite = siteName;
    localStorage.setItem('ql_active_site', siteName);
    if (state.current && state.current.siteName !== siteName) {
        stopPolling();
        state.current = null;
        updateConnBadge();
        document.getElementById('deviceContent').innerHTML = '<div class="ql-content-top" style="display:flex;align-items:center;justify-content:center;"><div class="ql-empty-state"><div class="ql-empty-icon">⌁</div><div class="ql-empty-title">请选择当前现场的设备</div><div class="ql-empty-desc">设备已经按现场隔离展示。</div></div></div>';
    }
    renderSiteTabs();
    renderTree(state.deviceGroups);
}
function renderTree(groups) {
    const ico = { STACKER_CRANE: '📦', CONVEYOR_LINE: '🛤️' };
    const siteGroups = (groups || []).map(group => ({
        ...group,
        devices: (group.devices || []).filter(device => device.siteName === state.activeSite)
    })).filter(group => group.devices.length);
    const siteDeviceCount = siteGroups.reduce((sum, group) => sum + group.devices.length, 0);
    const total = document.getElementById('deviceTotal');
    if (total) total.textContent = siteDeviceCount + ' 台';
    document.getElementById('deviceTreeContent').innerHTML = siteGroups.map(g => `
        <div class="ql-group"><div class="ql-group-title" onclick="this.parentElement.classList.toggle('collapsed')"><span class="arrow">▼</span>${ico[g.groupType]||'🔧'} ${g.groupName} <span style="margin-left:auto;font-size:10px;opacity:.5;">${g.devices.length}</span></div>
        <div class="ql-group-items" data-device-group="${g.groupType}" ondragover="deviceDragOver(event)" ondrop="deviceDrop(event)">
            ${g.devices.map(d => `<div class="ql-device ${state.current&&state.current.deviceId===d.deviceId?'active':''}" draggable="true" data-id="${d.deviceId}" data-name="${d.deviceName}" data-address="${d.ip}:${d.port}" data-group="${g.groupType}" onclick="selectDevice('${d.deviceId}')" ondragstart="deviceDragStart(event)" ondragend="deviceDragEnd(event)" title="${d.deviceName} · ${d.ip}:${d.port}"><span class="dev-dot ${d.connected?'on':''}"></span><span class="ql-device-copy"><span class="ql-device-name">${d.deviceName}</span><span class="ql-device-address">${d.ip}:${d.port}</span></span><span class="ql-device-drag" title="拖动调整顺序">⋮⋮</span></div>`).join('')}
        </div></div>`).join('') || '<div class="empty-hint">当前现场暂无设备<br><button class="glass-btn-outline" style="margin-top:10px" onclick="openDeviceDialog()">＋ 添加设备</button></div>';
}

let deviceDrag = null;
let deviceDropCommitted = false;
function deviceDragStart(event) {
    const item = event.currentTarget;
    deviceDrag = { id:item.dataset.id, groupType:item.dataset.group };
    deviceDropCommitted = false;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', item.dataset.id);
    requestAnimationFrame(() => {
        item.classList.add('dragging');
        item.parentElement?.classList.add('device-sorting');
    });
}
function deviceDragOver(event) {
    if (!deviceDrag || event.currentTarget.dataset.deviceGroup !== deviceDrag.groupType) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    const dragging = event.currentTarget.querySelector(`.ql-device[data-id="${deviceDrag.id}"]`);
    const target = event.target.closest('.ql-device');
    if (!dragging || !target || target === dragging || target.parentElement !== event.currentTarget) return;
    const before = event.clientY < target.getBoundingClientRect().top + target.offsetHeight / 2;
    event.currentTarget.insertBefore(dragging, before ? target : target.nextSibling);
}
async function deviceDrop(event) {
    if (!deviceDrag || event.currentTarget.dataset.deviceGroup !== deviceDrag.groupType) return;
    event.preventDefault();
    deviceDropCommitted = true;
    const order = [...event.currentTarget.querySelectorAll('.ql-device')].map(item => item.dataset.id);
    const request = { siteName:state.activeSite, deviceType:deviceDrag.groupType, deviceIds:order };
    event.currentTarget.classList.remove('device-sorting');
    event.currentTarget.querySelectorAll('.ql-device').forEach(item => item.classList.remove('dragging'));
    try {
        await api('/devices/order',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});
        await loadDeviceTree();
        toast('设备顺序已保存');
    } catch (e) {
        renderTree(state.deviceGroups);
        toast('保存排序失败：'+e.message,false);
    } finally {
        deviceDrag = null;
    }
}
function deviceDragEnd(event) {
    event.currentTarget.classList.remove('dragging');
    event.currentTarget.parentElement?.classList.remove('device-sorting');
    if (!deviceDropCommitted) renderTree(state.deviceGroups);
    if (!deviceDropCommitted) deviceDrag = null;
}
function filterDevices() {
    const q = document.getElementById('devSearch').value.trim().toLowerCase();
    document.querySelectorAll('.ql-device').forEach(el => { el.style.display = (!q || (el.dataset.name||'').toLowerCase().includes(q) || (el.dataset.id||'').toLowerCase().includes(q) || (el.dataset.address||'').toLowerCase().includes(q)) ? '' : 'none'; });
}
function selectDevice(deviceId) {
    state.current = state.devices.find(d => d.deviceId === deviceId);
    document.querySelectorAll('.ql-device').forEach(e => e.classList.toggle('active', e.dataset.id === deviceId));
    stopPolling(); renderPanel(state.current); updateConnBadge();
}
function updateConnBadge() {
    const b = document.getElementById('connBadge'), t = document.getElementById('connBadgeText');
    if (!state.current) { b.className='ql-conn-badge'; t.textContent='未连接'; return; }
    b.className = 'ql-conn-badge' + (state.current.connected ? ' online' : '');
    t.textContent = state.current.deviceName + (state.current.connected ? ' 已连接' : ' 未连接');
}

// ===== 面板 =====
window.qlPanels = window.qlPanels || {};
function renderDeviceHeader(d) {
    const online = !!d.connected;
    const taskToggle = d.deviceType === 'STACKER_CRANE' ? '' : '<button class="glass-btn-outline ql-task-toggle" id="taskToggle" onclick="toggleOpsPanel()">收起任务面板</button>';
    return `<div class="ql-dev-header"><div class="ql-dev-identity"><div class="ql-dev-icon">${d.deviceType==='STACKER_CRANE'?'▦':'⌁'}</div><div><div class="ql-dev-title-line"><h2 class="ql-dev-title">${d.deviceName}</h2><span class="ql-dev-state ${online?'online':''}" id="deviceStateText">${online?'在线':'离线'}</span></div><div class="ql-dev-meta"><span>${d.connectionType||'S7'}</span><span>${d.protocol||'-'}</span><span>${d.ip}:${d.port}</span></div></div></div><div class="ql-dev-actions">${taskToggle}<button class="glass-btn btn-connect" id="btnConnect" onclick="doConnect()">连接设备</button><button class="glass-btn btn-disconnect" id="btnDisconnect" onclick="doDisconnect()">断开</button></div></div>`;
}
function renderPanel(d) {
    const content = document.getElementById('deviceContent');
    const handler = window.qlPanels[d.deviceType];
    if (!handler) { content.innerHTML = `<div class="ql-content-top"><div class="empty-hint">该设备类型面板即将上线</div></div>`; return; }
    const { top, bottom } = handler.render(d);
    content.innerHTML = `<div class="ql-content-top">${renderDeviceHeader(d)}${top}</div>${bottom ? `<div class="ql-content-bottom ${state.opsPanelOpen===false?'is-collapsed':''}">${bottom}</div>` : ''}`;
    updateTaskToggle();
    updateConnState(d.connected);
    if (handler.init) handler.init(d);
    if (d.connected && handler.onConnected) handler.onConnected(d);
    if (!d.connected && handler.onDisconnected) handler.onDisconnected(d);
}
function updateConnState(connected) {
    const c = document.getElementById('btnConnect'), dc = document.getElementById('btnDisconnect');
    if (c) c.disabled = connected; if (dc) dc.disabled = !connected;
    const ds = document.getElementById('deviceStateText');
    if (ds) { ds.textContent = connected ? '在线' : '离线'; ds.classList.toggle('online', connected); }
    if (state.current) { const dot = document.querySelector(`.ql-device[data-id="${state.current.deviceId}"] .dev-dot`); if(dot) dot.classList.toggle('on', connected); }
}
function updateTaskToggle() {
    const btn = document.getElementById('taskToggle');
    if (btn) btn.textContent = state.opsPanelOpen===false ? '展开任务面板' : '收起任务面板';
}
function toggleOpsPanel() {
    state.opsPanelOpen = state.opsPanelOpen===false;
    const panel = document.querySelector('.ql-content-bottom');
    if (panel) panel.classList.toggle('is-collapsed', state.opsPanelOpen===false);
    updateTaskToggle();
}
async function doConnect() {
    if (!state.current) return;
    try {
        const item = await api(`/${state.current.deviceId}/connect`, {method:'POST'});
        state.current.connected = !!item.connected;
        updateConnState(state.current.connected);
        updateConnBadge();
        const h = window.qlPanels[state.current.deviceType];
        if (state.current.connected) {
            toast('已连接');
            if (h && h.onConnected) h.onConnected(state.current);
        } else {
            stopPolling();
            if (h && h.onDisconnected) h.onDisconnected(state.current);
            toast('连接失败：设备未建立连接', false);
        }
    } catch(e) {
        state.current.connected = false;
        updateConnState(false);
        updateConnBadge();
        stopPolling();
        const h = window.qlPanels[state.current.deviceType];
        if (h && h.onDisconnected) h.onDisconnected(state.current);
        toast('连接失败：'+e.message, false);
    }
}
async function doDisconnect() {
    if (!state.current) return;
    const current = state.current;
    const ok = await qlConfirm('断开连接', `确认断开“${current.deviceName}”？`);
    if (!ok) return;

    // Stop producing read requests before asking the backend to retire the session.
    stopPolling();
    current.connected = false;
    updateConnState(false);
    updateConnBadge();
    const handler = window.qlPanels[current.deviceType];
    if (handler && handler.onDisconnected) handler.onDisconnected(current);
    const button = document.getElementById('btnDisconnect');
    if (button) button.textContent = '正在断开…';
    try {
        await api(`/${current.deviceId}/disconnect`, {method:'POST'});
        toast('已断开');
    } catch (e) {
        toast('断开请求失败：' + e.message, false);
    } finally {
        if (button) button.textContent = '断开';
    }
}
async function doDisconnectLegacy() {
    if (!state.current) return;
    const ok = await qlConfirm('断开连接','确认断开「'+state.current.deviceName+'」？'); if(!ok) return;
    try { await api(`/${state.current.deviceId}/disconnect`, {method:'POST'}); state.current.connected=false; updateConnState(false); updateConnBadge(); stopPolling(); const h=window.qlPanels[state.current.deviceType]; if(h&&h.onDisconnected) h.onDisconnected(state.current); toast('已断开'); } catch(e){ toast(e.message, false); }
}

// ===== 轮询 =====
function startPolling(fn) { stopPolling(); state.pollStopped=false; state.pollFn=fn; pollTick(); }
async function pollTick() { if(state.pollStopped||!state.pollFn) return; if(document.hidden) return; try{await state.pollFn();}catch(e){} if(state.pollStopped||!state.pollFn||document.hidden) return; state.pollTimer=setTimeout(pollTick, state.settings.pollIntervalMs||1000); }
function stopPolling() { state.pollStopped=true; state.pollFn=null; if(state.pollTimer){clearTimeout(state.pollTimer);state.pollTimer=null;} }
document.addEventListener('visibilitychange', () => { if(document.hidden){if(state.pollTimer){clearTimeout(state.pollTimer);state.pollTimer=null;}}else if(!state.pollStopped&&state.pollFn&&!state.pollTimer){pollTick();} });

// ===== 设备管理 =====
function openDeviceDialog(ed) {
    const isEdit = !!ed; const d = ed || {};
    const root = document.getElementById('confirmRoot');
    const selectedSite = d.siteName || state.activeSite || (state.sites[0] && state.sites[0].siteName) || '';
    const siteOptions = state.sites.map(site => `<option value="${site.siteName}" ${site.siteName===selectedSite?'selected':''}>${site.siteName}</option>`).join('');
    root.innerHTML = `<div class="ql-modal-overlay" onclick="closeDeviceDialog()"><div class="ql-modal" onclick="event.stopPropagation()"><span class="ql-modal-close" onclick="closeDeviceDialog()">&times;</span><h3>${isEdit?'编辑设备':'添加设备'}</h3><div class="ql-modal-form">
        <div class="full"><label>所属现场 *</label><select class="glass-input" id="dm_site">${siteOptions}</select></div>
        <div class="full"><label>设备名称 *</label><input class="glass-input" id="dm_name" value="${d.deviceName||''}" placeholder="恒申堆垛机001"></div>
        <div><label>设备类型 *</label><select class="glass-input" id="dm_type"><option value="STACKER_CRANE" ${d.deviceType==='STACKER_CRANE'?'selected':''}>堆垛机</option><option value="CONVEYOR_LINE" ${d.deviceType==='CONVEYOR_LINE'?'selected':''}>输送线</option></select></div>
        <div><label>协议</label><select class="glass-input" id="dm_protocol"><option value="AIMS_V3" ${d.protocol==='AIMS_V3'?'selected':''}>AIMS_V3</option><option value="AIMS_V2" ${d.protocol==='AIMS_V2'?'selected':''}>AIMS_V2</option></select></div>
        <div><label>IP *</label><input class="glass-input" id="dm_ip" value="${d.ip||''}" placeholder="10.15.57.17"></div>
        <div><label>端口</label><input class="glass-input" type="number" id="dm_port" value="${d.port||102}"></div>
        <div><label>Rack</label><input class="glass-input" type="number" id="dm_rack" value="${d.rack??0}"></div>
        <div><label>Slot</label><input class="glass-input" type="number" id="dm_slot" value="${d.slot??0}"></div>
        <div><label>设备ID${isEdit?' (不可改)':' (可留空)'}</label><input class="glass-input" id="dm_id" value="${d.deviceId||''}" ${isEdit?'disabled':''}></div>
        <div><label>通信类型</label><select class="glass-input" id="dm_conn"><option value="SiemensS7" ${d.connectionType==='SiemensS7'?'selected':''}>SiemensS7</option><option value="ModbusTCP" ${d.connectionType==='ModbusTCP'?'selected':''}>ModbusTCP</option></select></div>
    </div><div class="ql-modal-actions"><button class="glass-btn-outline" onclick="closeDeviceDialog()">取消</button><button class="glass-btn btn-connect" onclick="submitDeviceForm('${isEdit?d.deviceId:''}')">${isEdit?'保存':'添加'}</button></div></div></div>`;
}
function closeDeviceDialog() { document.getElementById('confirmRoot').innerHTML = ''; }
async function submitDeviceForm(editId) {
    const siteName=document.getElementById('dm_site').value, name=document.getElementById('dm_name').value.trim(), type=document.getElementById('dm_type').value, ip=document.getElementById('dm_ip').value.trim(), port=parseInt(document.getElementById('dm_port').value)||102, rack=parseInt(document.getElementById('dm_rack').value)||0, slot=parseInt(document.getElementById('dm_slot').value)||0, protocol=document.getElementById('dm_protocol').value, connectionType=document.getElementById('dm_conn').value, deviceId=document.getElementById('dm_id').value.trim();
    if(!name){toast('请输入设备名称',false);return;} if(!ip){toast('请输入 IP',false);return;}
    const body={siteName,deviceName:name,deviceType:type,ip,port,rack,slot,protocol,connectionType}; if(deviceId&&!editId) body.deviceId=deviceId;
    const editingCurrent = !!(editId && state.current && state.current.deviceId === editId);
    const wasConnected = editingCurrent && state.current.connected;
    if (editingCurrent) stopPolling();
    try {
        const item = editId
            ? await api(`/devices/${editId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
            : await api('/devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        closeDeviceDialog();
        state.activeSite = siteName;
        localStorage.setItem('ql_active_site', siteName);
        await loadDeviceTree();
        if (editingCurrent) {
            state.current = state.devices.find(d => d.deviceId === editId) || item;
            renderPanel(state.current);
            updateConnBadge();
        }
        toast(editId ? '设备已更新，请重新连接' : '设备已添加');
    } catch(e) {
        if (wasConnected && state.current) {
            const handler = window.qlPanels[state.current.deviceType];
            if (handler && handler.onConnected) handler.onConnected(state.current);
        }
        toast(e.message,false);
    }
}
async function submitDeviceFormLegacy(editId) {
    const siteName=document.getElementById('dm_site').value, name=document.getElementById('dm_name').value.trim(), type=document.getElementById('dm_type').value, ip=document.getElementById('dm_ip').value.trim(), port=parseInt(document.getElementById('dm_port').value)||102, rack=parseInt(document.getElementById('dm_rack').value)||0, slot=parseInt(document.getElementById('dm_slot').value)||0, protocol=document.getElementById('dm_protocol').value, connectionType=document.getElementById('dm_conn').value, deviceId=document.getElementById('dm_id').value.trim();
    if(!name){toast('请输入设备名称',false);return;} if(!ip){toast('请输入IP',false);return;}
    const body={siteName,deviceName:name,deviceType:type,ip,port,rack,slot,protocol,connectionType}; if(deviceId&&!editId) body.deviceId=deviceId;
    try { if(editId){await api(`/devices/${editId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('已更新');}else{await api('/devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('已添加');} closeDeviceDialog(); await loadDeviceTree(); } catch(e){toast(e.message,false);}
}
function openDeviceManager() {
    const root = document.getElementById('confirmRoot');
    const list = state.devices.map(d=>`<div class="ql-dev-list-item"><div class="info"><div class="name">${d.deviceName}</div><div class="meta">${d.siteName} · ${d.deviceTypeLabel} · ${d.ip}:${d.port}</div></div><div class="ops"><a class="edit" onclick="editDeviceFromList('${d.deviceId}')">编辑</a><a class="del" onclick="deleteDeviceFromList('${d.deviceId}','${d.deviceName}')">删除</a></div></div>`).join('');
    root.innerHTML = `<div class="ql-modal-overlay" onclick="closeDeviceDialog()"><div class="ql-modal" onclick="event.stopPropagation()"><span class="ql-modal-close" onclick="closeDeviceDialog()">&times;</span><h3>设备管理</h3>${list||'<div class="empty-hint">暂无</div>'}<div class="ql-modal-actions"><button class="glass-btn btn-connect" onclick="closeDeviceDialog();openDeviceDialog();">＋ 添加</button></div></div></div>`;
}
function editDeviceFromList(id){const d=state.devices.find(x=>x.deviceId===id);if(d){closeDeviceDialog();openDeviceDialog(d);}}
async function deleteDeviceFromList(id,name){closeDeviceDialog();const ok=await qlConfirm('删除设备','永久删除「'+name+'」？');if(!ok){openDeviceManager();return;}try{await api(`/devices/${id}`,{method:'DELETE'});toast('已删除');if(state.current&&state.current.deviceId===id){state.current=null;stopPolling();document.getElementById('deviceContent').innerHTML='<div class="ql-content-top" style="display:flex;align-items:center;justify-content:center;"><div class="empty-hint">🐉 请选择设备</div></div>';}await loadDeviceTree();}catch(e){toast(e.message,false);}}

// ===== 现场管理 =====
function openSiteManager(focusNew) {
    const root = document.getElementById('confirmRoot');
    const rows = state.sites.map((site, index) => {
        const encoded = encodeURIComponent(site.siteName);
        return `<div class="ql-site-list-row"><input class="glass-input" id="sm_site_${index}" value="${site.siteName}"><span class="site-count">${site.deviceCount} 台设备</span><button class="glass-btn-outline" onclick="renameSite(decodeURIComponent('${encoded}'),${index})">保存</button><button class="glass-btn-outline" style="color:#dc5968" onclick="deleteSite(decodeURIComponent('${encoded}'))">删除</button></div>`;
    }).join('');
    root.innerHTML = `<div class="ql-modal-overlay" onclick="closeDeviceDialog()"><div class="ql-modal" onclick="event.stopPropagation()"><span class="ql-modal-close" onclick="closeDeviceDialog()">&times;</span><h3>现场管理</h3><div style="display:flex;gap:8px;margin-bottom:12px"><input class="glass-input" id="sm_new" placeholder="例如：比图美欣达" style="flex:1"><button class="glass-btn btn-connect" onclick="addSite()">＋ 新建现场</button></div>${rows||'<div class="empty-hint">暂无现场</div>'}<div class="ql-modal-actions"><button class="glass-btn-outline" onclick="closeDeviceDialog()">完成</button></div></div></div>`;
    if (focusNew) setTimeout(() => document.getElementById('sm_new')?.focus(), 0);
}
async function addSite() {
    const input = document.getElementById('sm_new');
    const siteName = input ? input.value.trim() : '';
    if (!siteName) { toast('请输入现场名称', false); return; }
    try {
        await api('/sites', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({siteName})});
        state.activeSite = siteName;
        localStorage.setItem('ql_active_site', siteName);
        closeDeviceDialog();
        await loadDeviceTree();
        toast('现场已创建');
    } catch (e) { toast(e.message, false); }
}
async function renameSite(oldName, index) {
    const input = document.getElementById('sm_site_' + index);
    const siteName = input ? input.value.trim() : '';
    if (!siteName) { toast('现场名称不能为空', false); return; }
    try {
        await api('/sites/' + encodeURIComponent(oldName), {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({siteName})});
        if (state.activeSite === oldName) {
            state.activeSite = siteName;
            localStorage.setItem('ql_active_site', siteName);
        }
        closeDeviceDialog();
        await loadDeviceTree();
        openSiteManager();
        toast('现场名称已更新');
    } catch (e) { toast(e.message, false); }
}
async function deleteSite(siteName) {
    closeDeviceDialog();
    const ok = await qlConfirm('删除现场', `确认删除“${siteName}”？现场下有设备时不能删除。`);
    if (!ok) { openSiteManager(); return; }
    try {
        await api('/sites/' + encodeURIComponent(siteName), {method:'DELETE'});
        if (state.activeSite === siteName) state.activeSite = '';
        await loadDeviceTree();
        openSiteManager();
        toast('现场已删除');
    } catch (e) {
        toast(e.message, false);
        openSiteManager();
    }
}

// ===== 时钟 + 启动 =====
setInterval(()=>{const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleString('zh-CN');},1000);
(async()=>{ try{state.settings=await api('/settings');}catch(e){} await loadDeviceTree(); })();
