<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCS 任务智能诊断</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* ========== Polished Overrides (放在最前以确保优先级) ========== */
        /* 顶栏：三栏对齐、文字层次 */
        .glass-topbar { padding: 0 28px; gap: 18px; }
        .topbar-logo { font-size: 15px; gap: 10px; color: var(--color-primary-dark); letter-spacing: .01em; }
        .topbar-logo img { width: 26px; height: 26px; }
        .topbar-center { gap: 8px; }
        .topbar-right { gap: 8px; }

        /* 环境徽标 */
        .env-badge {
            padding: 6px 14px; gap: 8px;
            background: rgba(99,102,241,0.08);
            border: 1px solid rgba(99,102,241,0.18);
            color: var(--color-primary-dark);
            font-weight: 600;
        }
        .env-badge:hover { background: rgba(99,102,241,0.14); border-color: rgba(99,102,241,.32); }
        .env-dot {
            width: 8px; height: 8px; box-shadow: 0 0 0 2px rgba(16,185,129,.18);
            animation: pulseGlow 1.8s ease-in-out infinite;
        }
        .env-url-hint { color: var(--color-text-muted); font-weight: 500; max-width: 220px; }
        .env-arrow { font-size: 10px; opacity: .55; transition: var(--transition); }
        .env-badge:hover .env-arrow { opacity: 1; }

        /* 模型徽标 */
        .model-tag {
            padding: 6px 14px; gap: 8px;
            background: rgba(139,92,246,0.10);
            border: 1px solid rgba(139,92,246,0.20);
            color: #6d28d9;
            font-weight: 600;
        }
        .model-tag:hover { background: rgba(139,92,246,.16); border-color: rgba(139,92,246,.32); }
        .model-tag .model-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            box-shadow: 0 0 0 2px rgba(139,92,246,.18);
        }

        /* 顶栏右侧操作按钮 */
        .topbar-right .glass-btn-outline {
            padding: 7px 14px; font-size: 13px; gap: 6px;
            background: rgba(255,255,255,.55);
            border: 1px solid rgba(99,102,241,.16);
            color: var(--color-text-secondary);
        }
        .topbar-right .glass-btn-outline:hover {
            background: rgba(255,255,255,.85);
            border-color: rgba(99,102,241,.32);
            color: var(--color-primary-dark);
            transform: translateY(-1px);
        }

        /* Hero */
        .hero-section { margin-top: 40px; margin-bottom: 28px; }
        .hero-card {
            padding: 44px 36px 36px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.58));
        }
        .hero-icon {
            font-size: 44px; margin-bottom: 14px;
            filter: drop-shadow(0 6px 16px rgba(99,102,241,.25));
        }
        .hero-title {
            font-size: 32px; font-weight: 800; line-height: 1.2;
            background: var(--gradient-text);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .hero-subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 26px; }
        .hero-input-row { gap: 12px; }
        .hero-input-row .glass-input {
            min-width: 260px; height: 46px; font-size: 14.5px;
            box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
        }
        .hero-input-row .glass-btn { height: 46px; padding: 0 22px; }
        .hero-input-row .glass-btn-outline { height: 46px; padding: 0 18px; font-size: 14px; }

        /* Scope 切换 */
        .scope-switch {
            padding: 4px;
            background: rgba(255,255,255,.6);
            border: 1px solid rgba(99,102,241,.14);
            border-radius: 14px;
            box-shadow: 0 1px 0 rgba(255,255,255,.55) inset;
        }
        .scope-option {
            padding: 9px 14px; font-size: 13px; border-radius: 10px;
            color: var(--color-text-secondary);
        }
        .scope-option:hover { color: var(--color-primary-dark); }
        .scope-option.active {
            background: #fff;
            color: var(--color-primary-dark);
            box-shadow: 0 1px 2px rgba(15,23,42,.06), inset 0 0 0 1px rgba(99,102,241,.18);
        }

        /* 错误条 */
        .error-box {
            margin-top: 16px;
            background: rgba(254, 242, 242, 0.85);
            border: 1px solid rgba(239,68,68,0.20);
            border-left: 3px solid var(--color-error);
            border-radius: 12px;
            padding: 12px 16px;
            color: #7f1d1d;
            font-size: 13.5px; font-weight: 500;
            display: none;
            box-shadow: 0 1px 0 rgba(255,255,255,.4) inset;
        }

        /* Step 卡片：克制柔和 */
        .step-card {
            background: rgba(255,255,255,0.62);
            border: 1px solid rgba(99,102,241,.10);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            transition: var(--transition);
        }
        .step-card:hover {
            border-color: rgba(99,102,241,.18);
            box-shadow: 0 8px 22px rgba(99,102,241,.08);
        }
        .step-icon {
            width: 28px; height: 28px; font-size: 12.5px; font-weight: 800;
        }
        .step-icon.pending {
            background: #e5e7eb; color: #9ca3af;
        }
        .step-label { font-size: 14px; font-weight: 700; }
        .step-content { padding-left: 40px; }
        .step-loading { gap: 10px; color: var(--color-text-secondary); }
        .spinner { width: 16px; height: 16px; border-width: 2px; }

        /* 空数据提示统一 */
        .empty-hint {
            padding: 14px 16px;
            border: 1px dashed rgba(99,102,241,.20);
            border-radius: 10px;
            background: rgba(255,255,255,.45);
            color: var(--color-text-muted);
            font-size: 13.5px;
            text-align: center;
        }

        /* AI 结果 */
        .ai-result-wrapper {
            background: linear-gradient(180deg, rgba(139,92,246,.08), rgba(99,102,241,.05));
            border: 1px solid rgba(139,92,246,0.16);
            border-radius: 16px;
            padding: 20px 22px;
        }
        .ai-summary {
            font-size: 15px; line-height: 1.75;
            background: rgba(255,255,255,.55);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,.7);
        }
        .rc-item {
            background: rgba(255,255,255,.7);
            border: 1px solid rgba(139,92,246,.14);
            border-left: 3px solid var(--color-secondary);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .rc-item:hover { transform: translateX(2px); border-left-color: var(--color-primary); }
        .rc-title { font-weight: 700; color: var(--color-primary-dark); }
        .rc-desc { color: var(--color-text-secondary); }

        /* 表格 */
        .data-table th {
            font-size: 11.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .04em;
            color: var(--color-text-muted);
            padding: 8px 12px;
        }
        .data-table td { padding: 8px 12px; }
        .data-table tr:hover td { background: rgba(99,102,241,.04); }

        /* 标签胶囊 */
        .tag {
            display: inline-block; padding: 3px 10px;
            border-radius: 999px; font-size: 11.5px; font-weight: 700;
            letter-spacing: .02em;
        }

        /* 日志暗色卡片 */
        .platform-log-card, .log-box {
            background: #0f1226;
            color: #e2e8f0;
            border: 1px solid rgba(99,102,241,.18);
            border-radius: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 12px 14px;
        }
        .platform-log-card .log-error, .log-box .log-error { color: #fca5a5; }
        .platform-log-card .log-warn, .log-box .log-warn { color: #fcd34d; }
    </style>
    <style>
        /* ========== Page-specific Styles ========== */
        .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

        /* -- Topbar internals -- */
        .topbar-logo {
            display: flex; align-items: center; gap: 8px;
            font-size: 16px; font-weight: 700; color: var(--color-primary);
            white-space: nowrap; flex-shrink: 0;
        }
        .topbar-logo span.icon { font-size: 20px; }
        .topbar-center { flex: 1; display: flex; justify-content: center; position: relative; min-width: 0; }
        .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        /* env badge in topbar */
        .env-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
            background: rgba(99,102,241,0.08); color: var(--color-primary);
            border: 1px solid rgba(99,102,241,0.15); cursor: pointer;
            transition: var(--transition); user-select: none;
        }
        .env-badge:hover { background: rgba(99,102,241,0.14); }
        .env-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-success); flex-shrink: 0; }
        .env-url-hint { font-size: 11px; color: var(--color-text-muted); margin-left: 4px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* env popover */
        .env-popover {
            top: 100%; left: 50%;
            width: 480px; max-width: calc(100vw - 32px);
            margin-top: 4px;
            /* use margin for centering to avoid animation overriding transform */
            margin-left: -240px;
            animation: popoverIn 0.2s ease-out;
        }
        @media (max-width: 540px) {
            .env-popover { left: auto; right: -60px; margin-left: 0; }
        }
        .env-popover-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-size: 15px; font-weight: 600; color: var(--color-text);
        }
        .env-close-btn {
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: var(--color-text-muted); transition: var(--transition);
        }
        .env-close-btn:hover { color: var(--color-error); }
        .env-add-section {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(99,102,241,0.08);
        }
        .env-add-section .label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
        .env-add-row { display: flex; gap: 8px; }
        .env-add-row input {
            flex: 1; height: 36px; padding: 0 12px;
            background: rgba(255,255,255,0.6); border: 1.5px solid rgba(99,102,241,0.12);
            border-radius: var(--radius-input); font-size: 13px; color: var(--color-text);
            outline: none; transition: var(--transition);
        }
        .env-add-row input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(99,102,241,0.1); }
        .env-add-btn {
            height: 36px; padding: 0 18px; background: var(--color-success); color: #fff;
            border: none; border-radius: var(--radius-btn); font-size: 13px; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: var(--transition);
        }
        .env-add-btn:hover { filter: brightness(1.1); }

        /* env list items */
        .env-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; margin-bottom: 6px;
            border-radius: 12px; border: 1px solid rgba(99,102,241,0.06);
            background: rgba(255,255,255,0.4); transition: var(--transition);
        }
        .env-item.active { background: rgba(99,102,241,0.06); border-color: rgba(99,102,241,0.15); }
        .env-item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .env-item-info { flex: 1; min-width: 0; }
        .env-item-name { font-size: 13px; font-weight: 500; color: var(--color-text); }
        .env-item-url { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .env-item-actions { display: flex; gap: 6px; align-items: center; }
        .env-switch-btn {
            height: 28px; padding: 0 12px; background: var(--gradient-btn); color: #fff;
            border: none; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 500;
            transition: var(--transition); white-space: nowrap;
        }
        .env-switch-btn:hover { box-shadow: 0 2px 8px rgba(99,102,241,0.3); }
        .env-del-btn {
            height: 28px; padding: 0 10px; background: transparent; color: var(--color-error);
            border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; font-size: 12px;
            cursor: pointer; transition: var(--transition); white-space: nowrap;
        }
        .env-del-btn:hover { background: rgba(239,68,68,0.06); }
        .env-active-badge {
            font-size: 11px; color: #fff; background: var(--color-success);
            padding: 3px 10px; border-radius: 10px; font-weight: 600;
        }

        /* -- Hero Section -- */
        .hero-section {
            margin-top: 48px; margin-bottom: 32px;
        }
        .hero-card {
            padding: 48px 40px 40px; text-align: center;
        }
        .hero-card:hover { transform: none; }
        .hero-icon { font-size: 48px; margin-bottom: 12px; display: block; }
        .hero-title {
            font-size: 28px; font-weight: 800; color: var(--color-text);
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-subtitle { font-size: 15px; color: var(--color-text-secondary); margin-bottom: 28px; }
        .hero-input-row {
            display: flex; gap: 10px; max-width: 760px; margin: 0 auto;
            justify-content: center; flex-wrap: wrap;
        }
        .hero-input-row .glass-input { flex: 1; min-width: 260px; height: 48px; font-size: 15px; }
        .hero-input-row .glass-btn { height: 48px; white-space: nowrap; }
        .hero-input-row .glass-btn-outline { height: 48px; white-space: nowrap; }
        .scope-switch {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px; border-radius: 16px;
            background: rgba(255,255,255,0.55); border: 1px solid rgba(99,102,241,0.12);
            backdrop-filter: blur(12px);
        }
        .scope-option {
            border: none; background: transparent; color: var(--color-text-secondary);
            padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: var(--transition);
        }
        .scope-option.active {
            background: linear-gradient(135deg, rgba(99,102,241,0.16), rgba(139,92,246,0.14));
            color: var(--color-primary);
            box-shadow: inset 0 0 0 1px rgba(99,102,241,0.12);
        }

        /* env toast */
        .env-toast {
            display: none; padding: 10px 16px; margin-top: 16px;
            background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);
            border-radius: var(--radius-card); font-size: 13px; color: var(--color-success);
            backdrop-filter: blur(12px); animation: fadeIn .3s ease;
        }

        /* -- Error Box -- */
        .error-box {
            display: none; margin-top: 16px; padding: 14px 18px;
            background: rgba(239,68,68,0.08);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(239,68,68,0.15);
            border-left: 4px solid var(--color-error);
            border-radius: var(--radius-card);
            color: var(--color-error); font-size: 14px; font-weight: 500;
        }

        /* -- Results Container -- */
        .results-wrapper {
            margin-top: 24px; padding: 24px;
        }
        .results-wrapper:hover { transform: none; }
        .results-wrapper:empty, .results-wrapper.hidden { display: none; }

        /* -- Step Cards -- */
        .step-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 14px; padding: 14px 16px;
            box-shadow: 0 4px 16px rgba(99,102,241,0.05);
            animation: fadeIn .4s ease;
            transition: var(--transition);
        }
        .step-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }
        .step-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

        /* -- Layout for #timeline -- */
        #timeline {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-items: start;
        }
        .step-icon {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
            transition: var(--transition);
        }
        .step-icon.active {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            box-shadow: 0 2px 8px rgba(99,102,241,0.25);
        }
        .step-icon.done {
            background: linear-gradient(135deg, var(--color-success), #34d399);
            box-shadow: 0 2px 8px rgba(16,185,129,0.25);
        }
        .step-icon.pending { background: rgba(156,163,175,0.3); }
        .step-label { font-size: 14px; font-weight: 700; color: var(--color-text); }
        .step-content { padding-left: 42px; }

        /* Loading spinner */
        .step-loading {
            display: flex; align-items: center; gap: 8px;
            color: var(--color-text-muted); font-size: 13px; padding: 4px 0;
        }
        .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(99,102,241,0.15);
            border-top-color: var(--color-primary);
            border-radius: 50%; animation: spin .7s linear infinite;
        }

        /* -- Data Table (inline fallback using glass-table tokens) -- */
        .data-table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            font-size: 12.5px; margin-top: 6px; table-layout: fixed;
        }
        .data-table th {
            background: rgba(99,102,241,0.05); text-align: left; padding: 5px 10px;
            border-bottom: 1px solid rgba(99,102,241,0.08); color: var(--color-text-secondary);
            font-weight: 600; font-size: 11.5px;
        }
        .data-table td {
            padding: 6px 10px; border-bottom: 1px solid rgba(99,102,241,0.04);
            color: var(--color-text); max-width: 160px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; line-height: 1.4;
        }
        .data-table td[title]:hover { overflow: visible; white-space: normal; word-break: break-all; }
        .data-table tr:last-child td { border-bottom: none; }

        /* Status tags */
        .tag {
            display: inline-block; padding: 2px 10px; border-radius: var(--radius-tag);
            font-size: 12px; font-weight: 600;
        }
        .tag-success { background: rgba(16,185,129,0.1); color: var(--color-success); }
        .tag-running { background: rgba(99,102,241,0.1); color: var(--color-primary); }
        .tag-error { background: rgba(239,68,68,0.1); color: var(--color-error); }
        .tag-init { background: rgba(156,163,175,0.1); color: var(--color-text-muted); }
        .tag-warn { background: rgba(245,158,11,0.1); color: var(--color-warning); }

        /* -- Log Box -- */
        .log-box {
            background: #1a1b2e; color: #d4d4d4;
            border-radius: var(--radius-card); padding: 10px 12px;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 11.5px; line-height: 1.5; max-height: 200px;
            overflow-y: auto; margin-top: 8px;
            border: 1px solid rgba(99,102,241,0.1);
        }

        /* -- Platform Log Card -- */
        .platform-log-card {
            background: #1e1e2e; color: #cdd6f4;
            border-radius: 8px; padding: 16px;
            font-family: 'Consolas', 'Cascadia Code', monospace;
            font-size: 12px; line-height: 1.6;
            max-height: 300px; overflow-y: auto;
            margin-top: 8px;
            border: 1px solid rgba(99,102,241,0.1);
        }
        .platform-log-card .log-line { white-space: pre-wrap; word-break: break-all; padding: 1px 0; }
        .platform-log-card .log-error { color: #f38ba8; }
        .platform-log-card .log-warn { color: #fab387; }

        /* -- Subtask area scrollable -- */
        .subtask-area {
            max-height: 400px;
            overflow-y: auto;
        }
        .log-line { white-space: pre-wrap; word-break: break-all; }

        /* -- AI Result -- */
        .ai-result-wrapper {
            background: rgba(139,92,246,0.06);
            backdrop-filter: blur(12px); border: 1px solid rgba(139,92,246,0.12);
            border-radius: var(--radius-card); padding: 18px 20px; margin-top: 4px;
        }
        .ai-summary { font-size: 15px; line-height: 1.75; color: var(--color-text); margin-bottom: 14px; }
        .rc-item {
            padding: 12px 14px; margin-bottom: 8px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px); border: 1px solid rgba(139,92,246,0.1);
            border-radius: 12px; border-left: 3px solid var(--color-secondary);
        }
        .rc-title { font-weight: 700; font-size: 13px; color: var(--color-secondary); margin-bottom: 4px; }
        .rc-desc { font-size: 13px; line-height: 1.65; color: var(--color-text-secondary); }
        .global-analysis-card {
            background: rgba(79,70,229,0.05);
            border: 1px solid rgba(99,102,241,0.12);
            border-radius: var(--radius-card);
            padding: 20px 22px;
            margin-top: 12px;
        }
        .global-header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            flex-wrap: wrap; margin-bottom: 14px;
        }
        .global-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 16px; font-weight: 700; color: var(--color-primary);
        }
        .global-meta {
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .meta-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
            background: rgba(99,102,241,0.08); color: var(--color-primary);
            border: 1px solid rgba(99,102,241,0.12);
        }
        .global-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;
            margin-bottom: 14px;
        }
        .global-chain {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;
            align-items: stretch; margin-top: 10px;
        }
        .global-chain-node {
            position: relative;
            background: rgba(255,255,255,0.62);
            border: 1px solid rgba(99,102,241,0.1);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(15,23,42,0.04);
        }
        .global-chain-node.root { border-color: rgba(239,68,68,0.18); }
        .global-chain-node.direct { border-color: rgba(245,158,11,0.18); }
        .global-chain-node.focus { border-color: rgba(99,102,241,0.18); }
        .global-chain-node-title {
            font-size: 12px; color: var(--color-text-muted); margin-bottom: 8px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .global-chain-node-id {
            font-size: 15px; font-weight: 700; color: var(--color-text); margin-bottom: 10px;
            word-break: break-word;
        }
        .global-chain-node-desc {
            font-size: 13px; color: var(--color-text-secondary); line-height: 1.7;
        }
        .global-chain-arrow {
            display: flex; align-items: center; justify-content: center;
            color: var(--color-primary); font-weight: 700; font-size: 20px;
        }
        .global-impact-list {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
        }
        .impact-pill {
            display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px;
            background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.12);
            color: var(--color-primary); font-size: 12px; font-weight: 600;
        }
        .global-stat {
            background: rgba(255,255,255,0.55); border: 1px solid rgba(99,102,241,0.08);
            border-radius: 14px; padding: 14px 16px;
        }
        .global-stat-label { font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; }
        .global-stat-value { font-size: 14px; font-weight: 700; color: var(--color-text); word-break: break-word; }
        .global-section-title {
            font-size: 14px; font-weight: 700; color: var(--color-text); margin: 16px 0 10px;
        }
        .global-empty {
            padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.45);
            color: var(--color-text-muted); font-size: 13px;
        }
        .global-task-list { display: flex; flex-direction: column; gap: 10px; }
        .global-task-item {
            background: rgba(255,255,255,0.55); border: 1px solid rgba(99,102,241,0.08);
            border-radius: 14px; padding: 14px 16px;
        }
        .global-task-item.is-highlight {
            border-color: rgba(99,102,241,0.22);
            box-shadow: 0 10px 28px rgba(99,102,241,0.10);
            background: rgba(99,102,241,0.06);
        }
        .global-task-actions {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
        }
        .mini-action-btn {
            border: 1px solid rgba(99,102,241,0.14);
            background: rgba(99,102,241,0.06);
            color: var(--color-primary);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .mini-action-btn:hover {
            transform: translateY(-1px);
            background: rgba(99,102,241,0.12);
        }
        .global-task-top {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .global-task-id { font-size: 14px; font-weight: 700; color: var(--color-text); }
        .global-task-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .global-task-reason { font-size: 13px; color: var(--color-text-secondary); line-height: 1.7; }
        .global-edge-list, .global-bottleneck-list {
            display: flex; flex-direction: column; gap: 8px;
        }
        .global-edge-item, .global-bottleneck-item {
            padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.5);
            border: 1px solid rgba(99,102,241,0.08); font-size: 13px; color: var(--color-text-secondary);
            line-height: 1.7;
        }
        .action-list { padding-left: 8px; margin-top: 12px; list-style: none; }
        .action-list li {
            font-size: 13px; line-height: 1.8; color: var(--color-text); padding: 3px 0;
            display: flex; align-items: baseline; gap: 10px;
        }
        .action-list li::before {
            content: '';
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            display: inline-block; position: relative; top: 1px;
        }

        /* -- Relevant Docs -- */
        .ref-docs-section { margin-top: 14px; margin-bottom: 14px; }
        .ref-docs-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 700; color: #3b82f6; margin-bottom: 10px;
        }
        .ref-doc-card {
            background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(139,92,246,0.08); border-left: 3px solid #60a5fa;
            border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
        }
        .ref-doc-source {
            display: inline-block; font-size: 11px; background: rgba(96,165,250,0.1); color: #3b82f6;
            border-radius: 4px; padding: 2px 8px; margin-bottom: 6px; font-weight: 500;
        }
        .ref-doc-content {
            font-size: 13px; line-height: 1.7; color: #555; white-space: pre-wrap; word-break: break-word;
        }
        .ref-doc-toggle {
            background: none; border: none; color: #3b82f6; font-size: 12px;
            cursor: pointer; padding: 4px 0 0; font-family: inherit;
        }
        .ref-doc-toggle:hover { text-decoration: underline; }

        .empty-hint { color: var(--color-text-muted); font-size: 13px; padding: 4px 0; }
        .conflict-warn { color: var(--color-error); font-weight: 600; }

        /* -- SOP Card -- */
        .sop-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: var(--radius-card); padding: 14px 16px;
            margin-bottom: 12px; box-shadow: 0 4px 16px rgba(99,102,241,0.06);
            animation: fadeIn .4s ease;
        }
        .sop-title { font-size: 15px; font-weight: 700; color: var(--color-secondary); margin-bottom: 14px; }
        .sop-endpoints {
            display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
            padding: 10px 16px; background: rgba(139,92,246,0.06);
            border-radius: 12px; font-size: 13px;
        }
        .sop-ep { padding: 3px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; }
        .sop-ep-s { background: rgba(99,102,241,0.1); color: var(--color-primary); }
        .sop-ep-e { background: rgba(16,185,129,0.1); color: var(--color-success); }

        .sop-rail {
            display: flex; align-items: flex-start; overflow-x: auto;
            padding: 16px 10px 20px; gap: 0;
        }
        .sop-stop {
            display: flex; flex-direction: column; align-items: center;
            min-width: 80px; flex-shrink: 0; position: relative; z-index: 2;
        }
        .sop-stop-dot {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700; color: #fff;
            backdrop-filter: blur(8px); border: 2px solid transparent;
            transition: all .3s;
        }
        .sop-stop-dot.done {
            background: linear-gradient(135deg, var(--color-success), #34d399);
            border-color: rgba(16,185,129,0.3);
        }
        .sop-stop-dot.active {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            border-color: rgba(99,102,241,0.3);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        .sop-stop-dot.waiting {
            background: rgba(156,163,175,0.15);
            border-color: rgba(156,163,175,0.2);
            color: var(--color-text-muted); font-size: 12px;
        }
        .sop-stop-dot.error {
            background: linear-gradient(135deg, var(--color-error), #f87171);
            border-color: rgba(239,68,68,0.3);
        }
        .sop-stop-name {
            font-size: 12px; font-weight: 700; color: var(--color-text);
            margin-top: 8px; text-align: center; white-space: nowrap;
        }
        .sop-stop-sub {
            font-size: 10px; color: var(--color-secondary); margin-top: 2px;
            text-align: center; white-space: nowrap; font-weight: 500;
        }
        .sop-conn {
            display: flex; flex-direction: column; align-items: center;
            min-width: 100px; flex: 1; flex-shrink: 0; padding-top: 17px;
        }
        .sop-conn-bar {
            width: 100%; height: 6px; border-radius: 3px;
            position: relative; overflow: hidden;
        }
        .sop-conn-bar.done {
            background: linear-gradient(90deg, var(--color-success), #34d399);
        }
        .sop-conn-bar.active {
            background: linear-gradient(90deg, var(--color-success), var(--color-primary));
        }
        .sop-conn-bar.active::after {
            content: ''; position: absolute; top: 0; left: -50%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
            animation: sopShine 1.5s infinite;
        }
        @keyframes sopShine { 0% { left: -50%; } 100% { left: 150%; } }
        .sop-conn-bar.waiting { background: rgba(156,163,175,0.15); }
        .sop-conn-bar.error { background: rgba(239,68,68,0.15); }
        .sop-conn-info {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; margin-top: 6px;
        }
        .sop-conn-badge {
            padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
        }
        .sop-conn-badge.done { background: rgba(16,185,129,0.1); color: var(--color-success); }
        .sop-conn-badge.active { background: rgba(99,102,241,0.1); color: var(--color-primary); }
        .sop-conn-badge.waiting { background: rgba(156,163,175,0.08); color: var(--color-text-muted); }
        .sop-conn-badge.error { background: rgba(239,68,68,0.1); color: var(--color-error); }
        .sop-conn-act { font-size: 11px; color: var(--color-text-muted); text-align: center; }

        /* -- Ticket sub-section in step -- */
        .ticket-section {
            margin: 8px 0 0 0; padding: 10px 14px;
            background: rgba(99,102,241,0.04); border-radius: 10px;
            border-left: 3px solid var(--color-primary);
        }
        .ticket-section-title {
            font-size: 12px; font-weight: 600; color: var(--color-primary); margin-bottom: 6px;
        }

        /* conflict suggestion */
        .conflict-tip {
            margin-top: 10px; padding: 10px 14px;
            background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.15);
            border-radius: 10px; font-size: 13px; color: var(--color-warning);
        }

        /* -- 上报事件历史时间线 -- */
        .report-tl {
            position: relative; margin: 6px 0 4px 0; padding-left: 18px;
            border-left: 2px dashed rgba(99,102,241,0.25);
        }
        .report-tl-item {
            position: relative; margin-bottom: 12px; padding: 10px 14px;
            background: rgba(255,255,255,0.6); border: 1px solid rgba(99,102,241,0.10);
            border-radius: 10px;
        }
        .report-tl-item::before {
            content: ''; position: absolute; left: -25px; top: 14px;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--color-primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .report-tl-item.has-retry::before { background: var(--color-error); box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }
        .report-tl-item.fail::before { background: var(--color-error); box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }
        .report-tl-item.success::before { background: var(--color-success); box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
        .report-tl-head {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            font-size: 13px; margin-bottom: 4px;
        }
        .report-tl-time { font-family: 'JetBrains Mono', Consolas, monospace; color: var(--color-text-secondary); font-size: 12px; }
        .report-tl-type {
            padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
            background: rgba(99,102,241,0.10); color: var(--color-primary);
        }
        .report-tl-state {
            padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
            background: rgba(148,163,184,0.12); color: var(--color-text-secondary);
        }
        .report-tl-state.ok { background: rgba(16,185,129,0.1); color: var(--color-success); }
        .report-tl-state.bad { background: rgba(239,68,68,0.1); color: var(--color-error); }
        .report-tl-state.warn { background: rgba(245,158,11,0.12); color: var(--color-warning); }
        .report-tl-retry {
            padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
            background: rgba(239,68,68,0.10); color: var(--color-error);
        }
        .report-tl-tag {
            padding: 2px 7px; border-radius: 6px; font-size: 11px;
            background: rgba(0,0,0,0.04); color: var(--color-text-secondary);
            font-family: 'JetBrains Mono', Consolas, monospace;
        }
        .report-tl-detail { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 2px; word-break: break-all; }
        .report-tl-empty { padding: 14px; text-align: center; color: var(--color-text-muted); font-size: 13px; }

        /* AI deep analyze button */
        .ai-deep-btn {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            font-size: 15px;
            padding: 10px 28px;
        }
        .ai-deep-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3);
        }
        .ai-deep-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* -- Model Tag & Popover -- */
        .model-tag {
            background: rgba(139, 92, 246, 0.08); color: #8b5cf6;
            border: 1px solid rgba(139, 92, 246, 0.15);
        }
        .model-tag:hover { background: rgba(139, 92, 246, 0.14); }
        #modelPopover {
            top: 100%; right: 0;
            width: 500px; max-width: calc(100vw - 32px);
            margin-top: 4px;
            animation: popoverIn 0.2s ease-out;
        }
        .model-popover-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-size: 15px; font-weight: 600; color: var(--color-text);
        }
        .model-close-btn {
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: var(--color-text-muted); transition: var(--transition);
        }
        .model-close-btn:hover { color: var(--color-error); }
        .model-item {
            display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 4px;
            border-radius: var(--radius-tag); transition: var(--transition);
        }
        .model-item-active {
            background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .model-item-inactive {
            background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .model-item-info { flex: 1; min-width: 0; }
        .model-item-name { font-size: 13px; font-weight: 600; color: var(--color-text); }
        .model-item-meta { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; }
        .model-switch-btn {
            height: 28px; padding: 0 12px; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff;
            border: none; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 500;
            transition: var(--transition); white-space: nowrap;
        }
        .model-switch-btn:hover { box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3); }
        .model-delete-btn {
            height: 28px; padding: 0 10px; background: transparent; color: var(--color-error);
            border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; font-size: 12px;
            cursor: pointer; transition: var(--transition); white-space: nowrap;
        }
        .model-delete-btn:hover { background: rgba(239, 68, 68, 0.06); }
        .model-active-badge {
            font-size: 11px; color: #fff; background: linear-gradient(135deg, #8b5cf6, #6366f1);
            padding: 3px 10px; border-radius: 10px; font-weight: 600;
        }
        .model-add-section {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(139, 92, 246, 0.08);
        }
        .model-add-section .label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
        .model-add-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .model-add-row select, .model-add-row input {
            height: 32px; padding: 0 8px; border: 1.5px solid rgba(139, 92, 246, 0.15);
            border-radius: 8px; font-size: 12px; outline: none; background: rgba(255,255,255,0.6);
            color: var(--color-text); transition: var(--transition);
        }
        .model-add-row select:focus, .model-add-row input:focus {
            border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.1);
        }
        .model-add-row input { flex: 1; }
        .model-add-btn {
            height: 32px; padding: 0 14px; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff;
            border: none; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
            font-weight: 600; transition: var(--transition);
        }
        .model-add-btn:hover { box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3); }
        #modelToast {
            display: none; padding: 10px 16px; margin-top: 16px;
            background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: var(--radius-card); font-size: 13px; color: #8b5cf6;
            backdrop-filter: blur(12px); animation: fadeIn .3s ease;
        }

        /* ===== 新增诊断数据源样式 ===== */
        /* DCS 设备状态卡片 */
        .dcs-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px; margin-top: 4px;
        }
        .dcs-card {
            background: rgba(255,255,255,0.55); border: 1px solid rgba(99,102,241,0.10);
            border-radius: 12px; padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(99,102,241,0.04);
        }
        .dcs-card.has-alarm { border-color: rgba(239,68,68,0.28); background: rgba(239,68,68,0.04); }
        .dcs-card-head {
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;
        }
        .dcs-card-code { font-size: 13px; font-weight: 700; color: var(--color-text); }
        .dcs-card-type { font-size: 11px; color: var(--color-text-muted); }
        .dcs-card-meta {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 11.5px; color: var(--color-text-secondary);
        }
        .dcs-meta-pill {
            padding: 2px 8px; border-radius: 10px; background: rgba(99,102,241,0.06);
            border: 1px solid rgba(99,102,241,0.10); color: var(--color-text-secondary);
        }
        .dcs-state-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dcs-alarm-box {
            margin-top: 8px; padding: 8px 10px;
            background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.18);
            border-left: 3px solid var(--color-error); border-radius: 8px;
        }
        .dcs-alarm-title { font-size: 12px; font-weight: 700; color: var(--color-error); margin-bottom: 4px; }
        .dcs-alarm-item {
            font-size: 12px; color: var(--color-error); line-height: 1.65; word-break: break-all;
        }
        .dcs-alarm-item + .dcs-alarm-item { margin-top: 4px; padding-top: 4px; border-top: 1px dashed rgba(239,68,68,0.18); }
        .tag-state-idle    { background: rgba(156,163,175,0.15); color: var(--color-text-muted); }
        .tag-state-running { background: rgba(99,102,241,0.10);  color: var(--color-primary); }
        .tag-state-fault   { background: rgba(239,68,68,0.10);   color: var(--color-error); }
        .tag-state-stopped { background: rgba(245,158,11,0.12);  color: var(--color-warning); }
        .tag-state-offline { background: rgba(75,85,99,0.18);    color: #4b5563; }

        /* 设备锁定 */
        .lock-row-locked    { background: rgba(245,158,11,0.05); }
        .lock-row-conflict  { background: rgba(239,68,68,0.06); }
        .lock-conflict-tag {
            display: inline-block; padding: 2px 8px; border-radius: 8px;
            background: rgba(239,68,68,0.10); color: var(--color-error);
            font-size: 11px; font-weight: 700; margin-left: 6px;
        }

        /* 数据采集 */
        .collect-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px; margin-top: 4px;
        }
        .collect-card {
            background: rgba(255,255,255,0.55); border: 1px solid rgba(99,102,241,0.10);
            border-radius: 12px; padding: 12px 14px;
        }
        .collect-card.failed   { border-color: rgba(239,68,68,0.28); background: rgba(239,68,68,0.04); }
        .collect-card.collecting { border-color: rgba(99,102,241,0.28); }
        .collect-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
        .collect-progress {
            font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
            color: var(--color-text-secondary);
        }
        .collect-meta { font-size: 12px; color: var(--color-text-secondary); line-height: 1.7; word-break: break-all; }
        .collect-content {
            margin-top: 6px; padding: 6px 8px; font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 11.5px; color: var(--color-text); background: rgba(99,102,241,0.04);
            border-radius: 6px; word-break: break-all;
        }
        @keyframes collectPulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
        .tag-collect-collecting { background: rgba(99,102,241,0.10); color: var(--color-primary); animation: collectPulse 1.4s ease-in-out infinite; }
        .tag-collect-success    { background: rgba(16,185,129,0.10); color: var(--color-success); }
        .tag-collect-failed     { background: rgba(239,68,68,0.10);  color: var(--color-error); }
        .tag-collect-canceled   { background: rgba(156,163,175,0.15); color: var(--color-text-muted); }

        /* 任务组联动 */
        .group-rail {
            display: flex; align-items: stretch; gap: 0; overflow-x: auto;
            padding: 8px 4px 4px;
        }
        .group-node {
            min-width: 200px; flex-shrink: 0;
            background: rgba(255,255,255,0.55); border: 1px solid rgba(99,102,241,0.10);
            border-radius: 12px; padding: 10px 12px;
        }
        .group-node.is-current {
            background: rgba(99,102,241,0.06); border-color: rgba(99,102,241,0.28);
            box-shadow: 0 4px 14px rgba(99,102,241,0.10);
        }
        .group-node-arrow {
            display: flex; align-items: center; justify-content: center;
            min-width: 24px; color: var(--color-text-muted); font-weight: 700;
        }
        .group-node-id { font-size: 13px; font-weight: 700; color: var(--color-text); margin-bottom: 4px; word-break: break-all; }
        .group-node-meta { font-size: 11.5px; color: var(--color-text-secondary); margin-bottom: 4px; }
        .group-node-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

        /* 货物位置 */
        .goods-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px; margin-top: 4px;
        }
        .goods-card {
            background: rgba(255,255,255,0.55); border: 1px solid rgba(99,102,241,0.10);
            border-radius: 12px; padding: 12px 14px;
        }
        .goods-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .goods-card-code { font-size: 13px; font-weight: 700; color: var(--color-text); }
        .goods-card-loc {
            font-size: 12.5px; color: var(--color-primary); font-weight: 600;
            margin: 4px 0 4px;
        }
        .goods-card-meta { font-size: 11.5px; color: var(--color-text-secondary); line-height: 1.7; word-break: break-all; }

        /* 指令错误信息 */
        .cmd-error-box {
            margin: 4px 0 0;
            padding: 8px 10px;
            background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.18);
            border-left: 3px solid var(--color-error); border-radius: 6px;
            font-size: 12px; color: var(--color-error); line-height: 1.7; word-break: break-all;
        }
        .cmd-error-label { font-weight: 700; margin-right: 4px; }

    </style>
</head>
<body>

<!-- ========== Top Bar ========== -->

    <div class="topbar-logo">

            <span id="envName">加载中…</span>

            <span class="env-arrow" aria-hidden="true">▼</span>

        <!-- Env Popover -->
        <div id="envPanel" class="glass-popover env-popover" style="display:none">
            <div class="env-popover-header">
                <span>⚙️ 环境管理</span>

                    <div class="env-add-row" style="margin-bottom:6px">
                        <input type="text" id="newEnvSshHost" placeholder="SSH主机（默认同WCS地址IP）" style="flex:1">
                    </div>
                    <div class="env-add-row">
                        <input type="text" id="newEnvLogPath"
                               placeholder="/aims/loong/loong-main/logs/schedule_loong-platform_all.log"

                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="topbar-center" id="modelBar" style="position:relative;flex:none;">
        <span class="glass-tag model-tag" onclick="toggleModelPanel()" role="button" tabindex="0" aria-label="切换模型" style="cursor:pointer;">
            <span class="model-dot" aria-hidden="true"></span>
            <span id="modelName">加载中…</span>
            <span class="env-arrow" aria-hidden="true">▼</span>
        </span>
        <!-- Model Popover -->
        <div id="modelPopover" class="glass-popover" style="display:none">
            <div class="model-popover-header">
                <span>⚙️ 模型管理</span>

    <div class="topbar-right">

            🏠 首页
        </a>
        <a href="rules.html" class="glass-btn-outline" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">
            📋 规则管理
        </a>
        <a href="chat.html" class="glass-btn-outline" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">
            💬 Agent 对话模式
        </a>
        <a href="docs.html" class="glass-btn-outline" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">
            📚 知识库管理

</nav>

<script>
/* ---- 环境配置 ---- */
function toggleEnvPanel() {
    var p = document.getElementById('envPanel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
    if (p.style.display === 'block') loadEnvs();
}

// 点击外部关闭 popover
document.addEventListener('click', function(e) {
    var panel = document.getElementById('envPanel');
    var bar = document.getElementById('envBar');
    if (panel.style.display === 'block' && !bar.contains(e.target)) {
        panel.style.display = 'none';
    }
    // 模型 popover
    var modelPanel = document.getElementById('modelPopover');
    var modelBar = document.getElementById('modelBar');
    if (modelPanel.style.display === 'block' && !modelBar.contains(e.target)) {
        modelPanel.style.display = 'none';
    }
});

function updateEnvBar(name, url) {
    document.getElementById('envName').textContent = name;
    document.getElementById('envUrl').textContent = url || '';
}

function showEnvToast(name) {
    var toast = document.getElementById('envToast');
    toast.innerHTML = '✅ 已切换到 <b>' + esc(name) + '</b> 环境';
    toast.style.display = 'block';
    setTimeout(function() { toast.style.display = 'none'; }, 3000);
}

function loadEnvs() {
    fetch('/api/v1/env/list').then(r => r.json()).then(data => {
        var active = data.active;
        var activeUrl = '';
        var html = '';
        window._envCache = {};
        data.envs.forEach(function(e) {
            window._envCache[e.name] = e;
            var isActive = e.name === active;
            if (isActive) activeUrl = e.wcsUrl;
            html += '<div class="env-item' + (isActive ? ' active' : '') + '">';
            html += '<div class="env-item-dot" style="background:' + (isActive ? 'var(--color-success)' : 'rgba(156,163,175,0.3)') + '"></div>';
            html += '<div class="env-item-info">';
            html += '<div class="env-item-name"' + (isActive ? ' style="font-weight:700"' : '') + '>' + esc(e.name) + '</div>';
            html += '<div class="env-item-url">' + esc(e.wcsUrl || '') + '</div>';
            if (e.jdbcUrl) {
                html += '<div class="env-item-url" style="font-size:11px;opacity:.8">🗄️ ' + esc(e.jdbcUrl) + '</div>';
            }
            if (e.sshUsername) {
                var sshHost = e.sshHost || '(同 WCS 主机)';
                var sshPort = e.sshPort || 22;
                html += '<div class="env-item-url" style="font-size:11px;opacity:.8">🔐 ' + esc(e.sshUsername) + '@' + esc(sshHost) + ':' + sshPort + '</div>';
            }
            html += '</div>';
            html += '<div class="env-item-actions">';
            html += '<button class="env-switch-btn" onclick="editEnv(\'' + esc(e.name) + '\')" style="background:rgba(99,102,241,0.12);color:#6366f1">编辑</button>';
            if (!isActive) {
                html += '<button class="env-switch-btn" onclick="switchEnv(\'' + esc(e.name) + '\')">切换</button>';
                if (e.name !== 'default') html += '<button class="env-del-btn" onclick="deleteEnv(\'' + esc(e.name) + '\')">删除</button>';
            } else {
                html += '<span class="env-active-badge">当前</span>';
            }
            html += '</div></div>';
        });
        document.getElementById('envList').innerHTML = html;
        updateEnvBar(active, activeUrl);
    });
}

function resetEnvForm() {
    window._editingEnvName = null;
    document.getElementById('newEnvName').value = '';
    document.getElementById('newEnvName').disabled = false;
    document.getElementById('newEnvUrl').value = '';
    document.getElementById('newEnvJdbcUrl').value = '';
    document.getElementById('newEnvDbUser').value = '';
    document.getElementById('newEnvDbPwd').value = '';
    document.getElementById('newEnvDbPwd').placeholder = '密码';
    document.getElementById('newEnvSshUser').value = '';
    document.getElementById('newEnvSshPwd').value = '';
    document.getElementById('newEnvSshPwd').placeholder = 'SSH密码';
    document.getElementById('newEnvSshPort').value = '';
    document.getElementById('newEnvSshHost').value = '';
    document.getElementById('newEnvLogPath').value = '';
    var btn = document.querySelector('.env-add-btn');
    if (btn) btn.textContent = '保存';
    var cancelBtn = document.getElementById('envEditCancel');
    if (cancelBtn) cancelBtn.style.display = 'none';
    var sectionLabel = document.getElementById('envFormLabel');
    if (sectionLabel) sectionLabel.textContent = '➕ 添加/更新环境';
}

function editEnv(name) {
    var e = (window._envCache || {})[name];
    if (!e) return;
    window._editingEnvName = name;
    document.getElementById('newEnvName').value = e.name;
    document.getElementById('newEnvName').disabled = true; // 名称作为主键，不允许在编辑时改名
    document.getElementById('newEnvUrl').value = e.wcsUrl || '';
    document.getElementById('newEnvJdbcUrl').value = e.jdbcUrl || '';
    document.getElementById('newEnvDbUser').value = e.dbUsername || '';
    document.getElementById('newEnvDbPwd').value = '';
    document.getElementById('newEnvDbPwd').placeholder = e.dbPassword ? '已设置（留空保持不变）' : '密码';
    document.getElementById('newEnvSshUser').value = e.sshUsername || '';
    document.getElementById('newEnvSshPwd').value = '';
    document.getElementById('newEnvSshPwd').placeholder = e.sshPassword ? '已设置（留空保持不变）' : 'SSH密码';
    document.getElementById('newEnvSshPort').value = e.sshPort || '';
    document.getElementById('newEnvSshHost').value = e.sshHost || '';
    document.getElementById('newEnvLogPath').value = e.logFilePath || '';

    // 自动展开有数据的分区
    if (e.jdbcUrl || e.dbUsername) {
        document.getElementById('envDbFields').style.display = '';
        document.getElementById('envDbToggle').textContent = '▼';
    }
    if (e.sshUsername || e.logFilePath || e.sshHost) {
        document.getElementById('envSshFields').style.display = '';
        document.getElementById('envSshToggle').textContent = '▼';
    }

    var btn = document.querySelector('.env-add-btn');
    if (btn) btn.textContent = '更新';
    var cancelBtn = document.getElementById('envEditCancel');
    if (cancelBtn) cancelBtn.style.display = '';
    var sectionLabel = document.getElementById('envFormLabel');
    if (sectionLabel) sectionLabel.textContent = '✏️ 编辑环境：' + name;
    document.getElementById('newEnvUrl').focus();
}

function toggleEnvDbFields() {
    var box = document.getElementById('envDbFields');
    var arrow = document.getElementById('envDbToggle');
    if (box.style.display === 'none') {
        box.style.display = '';
        arrow.textContent = '▼';
    } else {
        box.style.display = 'none';
        arrow.textContent = '▶';
    }
}

function toggleEnvSshFields() {
    var box = document.getElementById('envSshFields');
    var arrow = document.getElementById('envSshToggle');
    if (box.style.display === 'none') {
        box.style.display = '';
        arrow.textContent = '▼';
    } else {
        box.style.display = 'none';
        arrow.textContent = '▶';
    }
}

function switchEnv(name) {
    fetch('/api/v1/env/switch', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: name}) })
        .then(r => r.json()).then(function(data) {
            loadEnvs();
            showEnvToast(name);
        });
}

function addEnv() {
    var name = document.getElementById('newEnvName').value.trim();
    var url = document.getElementById('newEnvUrl').value.trim();
    if (!name || !url) { alert('请填写环境名称和WCS地址'); return; }

    var editing = window._editingEnvName === name;
    var existing = editing ? ((window._envCache || {})[name] || {}) : {};

    var jdbcUrl = document.getElementById('newEnvJdbcUrl').value.trim();
    var dbUser = document.getElementById('newEnvDbUser').value.trim();
    var dbPwd = document.getElementById('newEnvDbPwd').value;
    var sshUser = document.getElementById('newEnvSshUser').value.trim();
    var sshPwd = document.getElementById('newEnvSshPwd').value;
    var sshPort = document.getElementById('newEnvSshPort').value.trim();
    var sshHost = document.getElementById('newEnvSshHost').value.trim();
    var logPath = document.getElementById('newEnvLogPath').value.trim();

    var payload = { name: name, wcsUrl: url };

    // 数据库：留空字段保留现有值（仅在编辑时）
    if (jdbcUrl || editing && existing.jdbcUrl) {
        payload.jdbcUrl = jdbcUrl || existing.jdbcUrl;
        payload.dbUsername = dbUser || existing.dbUsername || '';
        payload.dbPassword = dbPwd !== '' ? dbPwd : (existing.dbPassword || '');
    }

    // SSH：用户名为空且原本无配置 → 不发；否则保留/合并
    if (sshUser || editing && existing.sshUsername) {
        payload.sshUsername = sshUser || existing.sshUsername;
        payload.sshPassword = sshPwd !== '' ? sshPwd : (existing.sshPassword || '');
        var port = sshPort || (existing.sshPort != null ? String(existing.sshPort) : '');
        if (port) payload.sshPort = parseInt(port);
        var host = sshHost || existing.sshHost || '';
        if (host) payload.sshHost = host;
        var lp = logPath || existing.logFilePath || '';
        if (lp) payload.logFilePath = lp;
    }

    fetch('/api/v1/env/save', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
        .then(r => r.json()).then(function() {
            resetEnvForm();
            loadEnvs();
        });
}

function deleteEnv(name) {
    if (!confirm('确定删除环境 ' + name + '？')) return;
    fetch('/api/v1/env/' + name, { method: 'DELETE' }).then(r => r.json()).then(function() { loadEnvs(); });
}

// 页面加载时获取当前环境（含轻量重试，避免后端冷启动期 AJAX 拿到失败结果就显示 default）
function bootstrapLoadEnv(retry) {
    fetch('/api/v1/env/list')
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(data) {
            var activeUrl = '';
            (data.envs || []).forEach(function(e) {
                if (e.name === data.active) activeUrl = e.wcsUrl;
            });
            updateEnvBar(data.active || 'default', activeUrl);
        })
        .catch(function() {
            if (retry > 0) {
                setTimeout(function() { bootstrapLoadEnv(retry - 1); }, 1000);
            } else {
                document.getElementById('envName').textContent = '加载失败';
            }
        });
}
bootstrapLoadEnv(8);

// 页面加载时获取当前模型（同样带重试）
function bootstrapLoadModel(retry) {
    fetch('/api/v2/diagnosis/models')
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(resp) {
            if (!resp || !resp.success || !resp.data) {
                throw new Error('bad response');
            }
            var active = resp.data.active;
            var models = resp.data.models || [];
            var label = '未配置';
            for (var i = 0; i < models.length; i++) {
                if (models[i].name === active) {
                    label = models[i].displayName || models[i].model;
                    break;
                }
            }
            document.getElementById('modelName').textContent = label;
        })
        .catch(function() {
            if (retry > 0) {
                setTimeout(function() { bootstrapLoadModel(retry - 1); }, 1000);
            } else {
                document.getElementById('modelName').textContent = '加载失败';
            }
        });
}
bootstrapLoadModel(8);

/* ---- 模型管理 ---- */
function toggleModelPanel() {
    var p = document.getElementById('modelPopover');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
    if (p.style.display === 'block') loadModels();
}

function toggleBaseUrlField() {
    var provider = document.getElementById('newModelProvider').value;
    document.getElementById('newModelBaseUrl').style.display = provider === 'zhipuai' ? 'none' : '';
}

function loadModels() {
    fetch('/api/v2/diagnosis/models').then(function(r) { return r.json(); }).then(function(resp) {
        if (!resp.success) return;
        var active = resp.data.active;
        var models = resp.data.models || [];
        var html = '';
        models.forEach(function(m) {
            var isActive = m.name === active;
            var providerLabel = m.provider === 'zhipuai' ? '智谱' : 'OpenAI兼容';
            html += '<div class="model-item ' + (isActive ? 'model-item-active' : 'model-item-inactive') + '">';
            html += '<div class="model-item-info">';
            html += '<div class="model-item-name" style="font-weight:' + (isActive ? '700' : '400') + '">' + esc(m.displayName || m.model) + '</div>';
            html += '<div class="model-item-meta">' + esc(providerLabel) + ' · ' + esc(m.model) + (m.baseUrl ? ' · ' + esc(m.baseUrl) : '') + '</div>';
            html += '</div>';
            if (!isActive) {
                html += '<button class="model-switch-btn" onclick="switchModel(\'' + esc(m.name) + '\')">切换</button>';
                if (m.name !== 'zhipuai-default') html += '<button class="model-delete-btn" onclick="deleteModel(\'' + esc(m.name) + '\')">删除</button>';
            } else {
                html += '<span class="model-active-badge">当前</span>';
            }
            html += '</div>';
        });
        document.getElementById('modelList').innerHTML = html;
        // 更新顶栏模型名
        models.forEach(function(m) {
            if (m.name === active) {
                document.getElementById('modelName').textContent = m.displayName || m.model;
            }
        });
    }).catch(function(err) { console.error('加载模型失败', err); });
}

function switchModel(name) {
    fetch('/api/v2/diagnosis/models/switch', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: name}) })
        .then(function(r) { return r.json(); }).then(function() {
            loadModels();
            var toast = document.getElementById('modelToastGlobal');
            toast.innerHTML = '✅ 模型已切换';
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 3000);
        });
}

function addModel() {
    var provider = document.getElementById('newModelProvider').value;
    var displayName = document.getElementById('newModelDisplayName').value.trim();
    var model = document.getElementById('newModelName').value.trim();
    var baseUrl = document.getElementById('newModelBaseUrl').value.trim();
    var apiKey = document.getElementById('newModelApiKey').value.trim();
    if (!model) { alert('请填写模型标识'); return; }
    if (!apiKey) { alert('请填写 API Key'); return; }
    if (provider === 'openai-compatible' && !baseUrl) { alert('请填写 API 地址'); return; }
    var name = provider + '-' + model.replace(/[^a-zA-Z0-9.-]/g, '-');
    fetch('/api/v2/diagnosis/models/save', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: name, displayName: displayName || model, provider: provider, baseUrl: baseUrl, apiKey: apiKey, model: model, temperature: 0.1 })
    }).then(function(r) { return r.json(); }).then(function() {
        document.getElementById('newModelDisplayName').value = '';
        document.getElementById('newModelName').value = '';
        document.getElementById('newModelBaseUrl').value = '';
        document.getElementById('newModelApiKey').value = '';
        loadModels();
    });
}

function deleteModel(name) {
    if (!confirm('确定删除该模型配置？')) return;
    fetch('/api/v2/diagnosis/models/' + encodeURIComponent(name), { method: 'DELETE' })
        .then(function(r) { return r.json(); }).then(function() { loadModels(); });
}

// 初始加载模型信息
loadModels();

const STEP_LABELS = {
    1: '主任务信息',
    2: '子任务 & 执行单',
    3: '子任务 & 执行单',
    4: '路径占用检查',
    5: '系统日志',
    6: '规则引擎分析'
};
const STEP_ICONS = { 1: '①', 2: '②', 3: '③', 4: '④', 5: '⑤', 6: '⑥' };
let diagnoseScope = 'single';

function setDiagnoseScope(scope) {
    diagnoseScope = scope === 'global' ? 'global' : 'single';
    var options = document.querySelectorAll('.scope-option');
    options.forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-scope') === diagnoseScope);
    });
    document.getElementById('mapBtn').style.display = diagnoseScope === 'global' ? 'none' : '';
}

function startDiagnose() {
    var taskId = document.getElementById('taskId').value.trim();
    if (!taskId) { alert('请输入任务ID'); return; }

    if (diagnoseScope === 'global') {
        startGlobalDiagnose(taskId);
        return;
    }

    var btn = document.getElementById('diagnoseBtn');
    var errorBox = document.getElementById('errorBox');
    var timeline = document.getElementById('timeline');

    btn.disabled = true;
    errorBox.style.display = 'none';
    timeline.innerHTML = '';
    document.getElementById('sopArea').innerHTML = '';

    // 存储数据用于构建 SOP
    var diagData = { task: null, items: null, commands: null };
    window._diagData = diagData;

    var source = new EventSource('/api/v1/diagnosis/stream?taskId=' + encodeURIComponent(taskId));

    source.addEventListener('step', function(e) {
        var d = JSON.parse(e.data);
        if (d.step === 3) return; // 命令合并到子任务中，不单独显示
        ensureStepCard(d.step, d.label);
    });

    source.addEventListener('task', function(e) {
        var task = JSON.parse(e.data);
        diagData.task = task;
        var card = getStepContent(1);
        card.innerHTML = renderTaskTable(task);
        markStepDone(1);
    });

    source.addEventListener('taskItems', function(e) {
        var items = JSON.parse(e.data);
        diagData.items = items;
        var card = getStepContent(2);
        card.innerHTML = '<div class="subtask-area">' + renderTaskItems(items, null) + '</div>';
        markStepDone(2);
    });

    source.addEventListener('commands', function(e) {
        var commands = JSON.parse(e.data);
        diagData.commands = commands;
        // 重新渲染子任务（含命令）
        var card = getStepContent(2);
        card.innerHTML = '<div class="subtask-area">' + renderTaskItems(diagData.items, commands) + '</div>';
        // step 3 直接标记完成，不单独显示
        markStepDone(3);
        // 渲染 SOP
        renderSOP(diagData);
    });

    source.addEventListener('conflicts', function(e) {
        var conflicts = JSON.parse(e.data);
        var card = getStepContent(4);
        card.innerHTML = renderConflicts(conflicts);
        markStepDone(4);
    });

    source.addEventListener('devices', function(e) {
        var devices = JSON.parse(e.data);
        renderDeviceInfo(devices);
    });

    source.addEventListener('logs', function(e) {
        var logs = JSON.parse(e.data);
        var card = getStepContent(5);
        card.innerHTML = renderLogs(logs);
        markStepDone(5);
    });

    source.addEventListener('reportEvents', function(e) {
        var events = JSON.parse(e.data);
        renderReportEvents(events);
    });

    source.addEventListener('deviceRunningStates', function(e) {
        var states = JSON.parse(e.data);
        renderDcsRunningStates(states);
    });

    source.addEventListener('deviceLocks', function(e) {
        var locks = JSON.parse(e.data);
        renderDeviceLocks(locks, taskId);
    });

    source.addEventListener('collectedData', function(e) {
        var collected = JSON.parse(e.data);
        renderCollectedData(collected);
    });

    source.addEventListener('taskGroup', function(e) {
        var group = JSON.parse(e.data);
        renderTaskGroup(group, taskId);
    });

    source.addEventListener('goodsStates', function(e) {
        var goods = JSON.parse(e.data);
        renderGoodsStates(goods);
    });

    source.addEventListener('platformLogs', function(e) {
        var logs = JSON.parse(e.data);
        renderPlatformLogs(logs);
    });

    source.addEventListener('ai', function(e) {
        var ai = JSON.parse(e.data);
        var card = getStepContent(6);
        card.innerHTML = renderAI(ai);
        markStepDone(6);
    });

    source.addEventListener('done', function() {
        source.close();
        btn.disabled = false;
        document.getElementById('mapBtn').style.display = '';
    });

    source.addEventListener('error', function(e) {
        if (e.data) {
            var d = JSON.parse(e.data);
            errorBox.textContent = '⚠️ ' + d.message;
            errorBox.style.display = 'block';
        }
        source.close();
        btn.disabled = false;
    });

    source.onerror = function() {
        source.close();
        btn.disabled = false;
    };
}

function startGlobalDiagnose(taskId) {
    var btn = document.getElementById('diagnoseBtn');
    var errorBox = document.getElementById('errorBox');
    var timeline = document.getElementById('timeline');

    btn.disabled = true;
    errorBox.style.display = 'none';
    timeline.innerHTML = '<div class="step-card active"><div class="step-header"><div class="step-icon active">◎</div><div class="step-label">全局关联诊断</div></div><div class="step-content"><div class="step-loading"><div class="spinner"></div><span>正在分析关联任务、阻塞链与瓶颈资源...</span></div></div></div>';
    document.getElementById('sopArea').innerHTML = '';

    fetch('/api/v1/diagnosis/task', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskNo: taskId, scope: 'global', timeWindowMinutes: 30 })
    })
        .then(function(r) { return r.json(); })
        .then(function(resp) {
            if (!resp || !resp.success || !resp.data) {
                throw new Error(resp && resp.message ? resp.message : '全局诊断失败');
            }
            timeline.innerHTML = renderGlobalDiagnosis(resp.data);
        })
        .catch(function(err) {
            errorBox.textContent = '⚠️ ' + (err && err.message ? err.message : '全局诊断失败');
            errorBox.style.display = 'block';
            timeline.innerHTML = '';
        })
        .finally(function() {
            btn.disabled = false;
        });
}

function ensureStepCard(step, label) {
    if (document.getElementById('step-' + step)) {
        return;
    }
    var timeline = document.getElementById('timeline');
    var div = document.createElement('div');
    div.className = 'step-card active';
    div.id = 'step-' + step;
    div.setAttribute('data-step', step);
    div.innerHTML =
        '<div class="step-header">' +
            '<div class="step-icon active">' + STEP_ICONS[step] + '</div>' +
            '<div class="step-label">' + esc(STEP_LABELS[step]) + '</div>' +
        '</div>' +
        '<div class="step-content" id="step-content-' + step + '">' +
            '<div class="step-loading"><div class="spinner"></div><span>' + esc(label || '加载中...') + '</span></div>' +
        '</div>';
    timeline.appendChild(div);
}

function getStepContent(step) {
    return document.getElementById('step-content-' + step);
}

function markStepDone(step) {
    var card = document.getElementById('step-' + step);
    if (card) {
        card.className = 'step-card done';
        card.setAttribute('data-step', step);
        var icon = card.querySelector('.step-icon');
        if (icon) { icon.className = 'step-icon done'; icon.textContent = '✓'; }
        var lbl = card.querySelector('.step-label');
        if (lbl) lbl.textContent = STEP_LABELS[step];
    }
}

/* ---- 渲染函数 ---- */

function renderTaskTable(t) {
    return '<table class="data-table">' +
        '<tr><th>任务ID</th><td>' + esc(t.taskId) + '</td><th>任务号</th><td>' + esc(t.taskNo) + '</td></tr>' +
        '<tr><th>任务状态</th><td>' + stateTag(t.taskState) + '</td><th>任务类型</th><td>' + esc(t.taskType) + '</td></tr>' +
        '<tr><th>业务类型</th><td>' + esc(t.bizType) + '</td><th>任务来源</th><td>' + esc(t.taskSource) + '</td></tr>' +
        '<tr><th>起点节点</th><td title="' + esc(t.startNode) + '">' + esc(t.startNode) + '</td><th>终点节点</th><td title="' + esc(t.endNode) + '">' + esc(t.endNode) + '</td></tr>' +
        '<tr><th>容器信息</th><td colspan="3">' + esc(t.containerCode || t.containerList) + '</td></tr>' +
        '<tr><th>创建时间</th><td>' + fmtTime(t.createTime) + '</td><th>开始时间</th><td>' + fmtTime(t.startTime) + '</td></tr>' +

    '</table>';
}

function renderTaskItems(items, commands) {
    if (!items || items.length === 0) return '<div class="empty-hint">无子任务数据</div>';

    // 按子任务分组命令
    var commandsByItem = {};
    if (commands && commands.length > 0) {
        commands.forEach(function(t) {
            var k = t.taskItemNo || '_';
            if (!commandsByItem[k]) commandsByItem[k] = [];
            commandsByItem[k].push(t);
        });
    }

    var now = new Date();
    var html = '';
    items.forEach(function(it, idx) {
        // 子任务信息
        html += '<div style="' + (idx > 0 ? 'margin-top:16px;padding-top:14px;border-top:1px solid rgba(99,102,241,0.06)' : '') + '">';
        html += '<table class="data-table"><thead><tr>' +
            '<th>子任务号</th><th>任务状态</th><th>起点</th><th>终点</th><th>设备</th><th>动作</th><th>创建时间</th>' +
            '</tr></thead><tbody>';
        html += '<tr>' +
            '<td title="' + esc(it.taskItemNo || it.id) + '">' + esc(it.taskItemNo || it.id) + '</td>' +
            '<td>' + stateTag(it.taskItemState) + '</td>' +
            '<td title="' + esc(it.startNode) + '">' + esc(it.startNode) + '</td>' +
            '<td title="' + esc(it.endNode) + '">' + esc(it.endNode) + '</td>' +
            '<td title="' + esc(it.deviceCode) + '">' + esc(it.deviceCode) + '</td>' +
            '<td>' + esc(it.taskAction) + '</td>' +
            '<td>' + fmtTime(it.createTime) + '</td>' +
        '</tr></tbody></table>';

        // 该子任务的命令
        var itCommands = commandsByItem[it.taskItemNo] || commandsByItem[it.id] || [];
        if (itCommands.length > 0) {
            html += '<div class="ticket-section">';
            html += '<div class="ticket-section-title">命令 (' + itCommands.length + ')</div>';
            html += '<table class="data-table"><thead><tr>' +
                '<th>PLC任务号</th><th>命令状态</th><th>起点</th><th>终点</th><th>设备类型</th><th>设备编码</th><th>开始时间</th><th>已耗时</th>' +
                '</tr></thead><tbody>';
            itCommands.forEach(function(t) {
                var elapsed = '';
                if (t.startTime && t.commandState === 'RUNNING') {
                    elapsed = calcElapsed(t.startTime, now);
                } else if (t.startTime && t.finishTime) {
                    elapsed = calcElapsed(t.startTime, parseTime(t.finishTime));
                }
                var elapsedCls = '';
                if (t.commandState === 'RUNNING' && t.startTime) {
                    var mins = getElapsedMinutes(t.startTime, now);
                    if (mins > 5) elapsedCls = ' style="color:var(--color-error);font-weight:600"';
                    else if (mins > 2) elapsedCls = ' style="color:var(--color-warning);font-weight:600"';
                }
                html += '<tr>' +
                    '<td>' + esc(t.plcTaskNo) + '</td>' +
                    '<td>' + stateTag(t.commandState) + '</td>' +
                    '<td>' + esc(t.startNode) + '</td>' +
                    '<td>' + esc(t.endNode) + '</td>' +
                    '<td>' + esc(t.deviceType) + '</td>' +
                    '<td>' + esc(t.deviceCode) + '</td>' +
                    '<td>' + fmtTime(t.startTime) + '</td>' +
                    '<td' + elapsedCls + '>' + elapsed + '</td>' +
                '</tr>';
                var errorHtml = renderCommandErrorRow(t);
                if (errorHtml) {
                    html += '<tr><td colspan="8" style="padding:0 6px 6px;border-bottom:none;">' + errorHtml + '</td></tr>';
                }
            });
            html += '</tbody></table></div>';
        }
        html += '</div>';
    });
    return html;
}

function renderTickets(commands) {
