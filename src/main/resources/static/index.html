<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCS 任务智能诊断</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f5f3ff 100%);
            min-height: 100vh;
            margin: 0;
            color: #1f2937;
        }
        /* ===== 导航栏 ===== */
        .nav {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(99,102,241,0.12);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-inner {
            max-width: 1100px; margin: 0 auto;
            display: flex; align-items: center; gap: 4px;
            padding: 0 24px; height: 52px;
        }
        .nav-brand {
            font-weight: 800; font-size: 16px;
            background: linear-gradient(135deg,#6366f1,#8b5cf6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-right: 16px; white-space: nowrap;
        }
        .nav a {
            display: flex; align-items: center; gap: 5px;
            padding: 6px 14px; border-radius: 8px;
            font-size: 14px; font-weight: 500; color: #4b5563;
            text-decoration: none; transition: all .15s;
        }
        .nav a:hover { background: rgba(99,102,241,0.08); color: #4f46e5; }
        .nav a.active { background: rgba(99,102,241,0.12); color: #4f46e5; font-weight: 600; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
        .hero {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.08);
        }
        .hero-icon { font-size: 48px; margin-bottom: 12px; display: block; }
        .hero-title {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-subtitle { font-size: 15px; color: #6b7280; margin-bottom: 28px; }
        .input-row {
            display: flex;
            gap: 12px;
            max-width: 640px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 1;
            min-width: 240px;
            height: 48px;
            padding: 0 18px;
            border: 1.5px solid rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.6);
            outline: none;
            transition: all 0.2s;
        }
        .input-row input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }
        .input-row button {
            height: 48px;
            padding: 0 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .input-row button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }
        .input-row button:disabled { opacity: 0.6; cursor: not-allowed; }
        .hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 12px;
        }
        .error-box {
            display: none;
            margin-top: 24px;
            padding: 14px 18px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444;
            border-radius: 12px;
            color: #b91c1c;
            font-size: 14px;
        }
        .result-card {
            display: none;
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 28px 32px;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.06);
        }
        .result-badge-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-rule { background: rgba(16, 185, 129, 0.12); color: #059669; }
        .badge-llm { background: rgba(139, 92, 246, 0.12); color: #7c3aed; }
        .badge-fallback { background: rgba(245, 158, 11, 0.12); color: #d97706; }
        .badge-confidence { background: rgba(99, 102, 241, 0.1); color: #4f46e5; }
        .badge-trace { background: rgba(107, 114, 128, 0.08); color: #6b7280; font-family: monospace; }
        .summary {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
            color: #1f2937;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #4f46e5;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, #6366f1, #8b5cf6);
            border-radius: 2px;
        }
        .rc-item {
            padding: 14px 16px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.12);
            border-left: 3px solid #8b5cf6;
            border-radius: 12px;
        }
        .rc-title {
            font-weight: 700;
            font-size: 14px;
            color: #7c3aed;
            margin-bottom: 6px;
        }
        .rc-desc {
            font-size: 13px;
            line-height: 1.7;
            color: #4b5563;
        }
        .action-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .action-list li {
            font-size: 14px;
            line-height: 1.7;
            color: #1f2937;
            padding: 8px 0 8px 20px;
            position: relative;
        }
        .action-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 16px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        .spinner-wrap {
            display: none;
            margin-top: 24px;
            text-align: center;
            padding: 24px;
            color: #6b7280;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2.5px solid rgba(99, 102, 241, 0.18);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-links {
            text-align: center;
            margin-top: 32px;
            font-size: 13px;
            color: #9ca3af;
        }
        .footer-links a {
            color: #6366f1;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<nav class="nav">
    <div class="nav-inner">
        <span class="nav-brand">🔍 WCS 诊断平台</span>
        <a href="/index.html" class="active">🏠 诊断</a>
        <a href="/task.html">📋 任务查询</a>
        <a href="/rules.html">⚙️ 规则管理</a>
        <a href="/chat.html">💬 AI 对话</a>
        <a href="/docs.html">📄 文档管理</a>
        <a href="/map.html">🗺️ 地图</a>
        <span id="envIndicator" style="margin-left:auto;font-size:12px;color:#6b7280;display:flex;align-items:center;gap:6px;cursor:pointer;" onclick="toggleEnvPanel()" title="点击配置环境">
            <span style="width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;"></span>
            <span id="envLabel">-</span>
            <span style="font-size:10px;color:#9ca3af">⚙</span>
        </span>
    </div>
</nav>

<!-- 环境配置面板 -->
<div id="envPanel" style="display:none;position:fixed;top:52px;right:16px;z-index:500;background:#fff;border:1px solid rgba(99,102,241,0.2);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:20px;min-width:360px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <span style="font-weight:700;font-size:14px;color:#1f2937">⚙️ 环境配置</span>
        <button onclick="toggleEnvPanel()" style="background:none;border:none;cursor:pointer;font-size:16px;color:#9ca3af;padding:2px 6px;">✕</button>
    </div>
    <!-- 快速切换环境 -->
    <div style="margin-bottom:14px;">
        <div style="font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600;">快速切换环境</div>
        <div id="envBtnGroup" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
    <!-- 自定义平台 URL -->
    <div style="margin-bottom:14px;">
        <div style="font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600;">平台服务地址 (loong-platform)</div>
        <div style="display:flex;gap:8px;">
            <input id="platformUrlInput" type="text" placeholder="http://127.0.0.1:18081"
                style="flex:1;height:34px;padding:0 10px;border:1.5px solid rgba(99,102,241,0.2);border-radius:8px;font-size:13px;outline:none;">
            <button onclick="savePlatformUrl()" style="height:34px;padding:0 14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">保存</button>
        </div>
    </div>
    <!-- 地图 URL -->
    <div style="margin-bottom:4px;">
        <div style="font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600;">地图服务地址（留空则与平台地址相同）</div>
        <div style="display:flex;gap:8px;">
            <input id="mapUrlInput" type="text" placeholder="留空则使用平台地址"
                style="flex:1;height:34px;padding:0 10px;border:1.5px solid rgba(99,102,241,0.2);border-radius:8px;font-size:13px;outline:none;">
            <button onclick="savePlatformUrl()" style="height:34px;padding:0 14px;background:rgba(99,102,241,0.1);color:#4f46e5;border:1.5px solid rgba(99,102,241,0.2);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">保存</button>
        </div>
    </div>
    <div id="envSaveMsg" style="font-size:12px;color:#10b981;margin-top:8px;display:none;">✓ 已保存，立即生效</div>
</div>
<div class="container">
    <div class="hero">
        <span class="hero-icon">🔍</span>
        <h1 class="hero-title">WCS 任务智能诊断</h1>
        <p class="hero-subtitle">输入任务号，分析任务为何卡住并给出操作建议</p>
        <div class="input-row">
            <input id="taskIdInput" type="text" placeholder="请输入任务号（如 WMS_TASK_001）" autocomplete="off">
            <button id="analyzeBtn" onclick="analyze()">开始诊断</button>
        </div>
        <div class="hint">调用 POST /api/v1/diagnosis/analyze</div>
    </div>

    <div id="errorBox" class="error-box"></div>
    <div id="spinner" class="spinner-wrap"><span class="spinner"></span>正在诊断，请稍候...</div>
    <div id="resultCard" class="result-card"></div>

    <div class="footer-links">
        <a href="/swagger-ui.html" target="_blank">Swagger UI</a>
        ·
        <a href="/task.html">任务查询</a>
        ·
        <a href="/rules.html">规则管理</a>
        ·
        <a href="/chat.html">AI 对话</a>
        ·
        <a href="/docs.html">文档管理</a>
        ·
        <a href="/map.html">地图</a>
    </div>
</div>

<script>
    var taskIdInput = document.getElementById('taskIdInput');
    var analyzeBtn = document.getElementById('analyzeBtn');
    var errorBox = document.getElementById('errorBox');
    var resultCard = document.getElementById('resultCard');
    var spinner = document.getElementById('spinner');

    taskIdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') analyze();
    });

    function analyze() {
        var taskId = (taskIdInput.value || '').trim();
        if (!taskId) {
            showError('请输入任务号');
            return;
        }
        hideError();
        resultCard.style.display = 'none';
        spinner.style.display = 'block';
        analyzeBtn.disabled = true;

        fetch('/api/v1/diagnosis/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskId: taskId })
        }).then(function(r) {
            return r.json().then(function(body) {
                return { status: r.status, body: body };
            });
        }).then(function(resp) {
            spinner.style.display = 'none';
            analyzeBtn.disabled = false;
            if (resp.body && resp.body.success && resp.body.data) {
                renderResult(resp.body.data);
            } else {
                var msg = (resp.body && resp.body.message) || ('HTTP ' + resp.status);
                var code = (resp.body && resp.body.code) || 'ERROR';
                showError('[' + code + '] ' + msg);
            }
        }).catch(function(err) {
            spinner.style.display = 'none';
            analyzeBtn.disabled = false;
            showError('网络错误: ' + (err.message || err));
        });
    }

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
    }
    function hideError() {
        errorBox.style.display = 'none';
    }

    function renderResult(data) {
        var mode = data.diagnosisMode || 'fallback';
        var confidence = typeof data.confidence === 'number' ? (data.confidence * 100).toFixed(0) + '%' : '-';
        var traceId = data.traceId || '-';

        var modeBadge;
        if (mode === 'rule') modeBadge = '<span class="badge badge-rule">🎯 规则命中</span>';
        else if (mode === 'llm') modeBadge = '<span class="badge badge-llm">🤖 LLM 分析</span>';
        else modeBadge = '<span class="badge badge-fallback">⚠ 兜底</span>';

        var html = ''
            + '<div class="result-badge-row">'
            +   modeBadge
            +   '<span class="badge badge-confidence">置信度 ' + confidence + '</span>'
            +   '<span class="badge badge-trace">trace: ' + escapeHtml(traceId) + '</span>'
            + '</div>'
            + '<div class="summary">' + escapeHtml(data.summary || '无摘要') + '</div>';

        if (data.rootCauses && data.rootCauses.length > 0) {
            html += '<div class="section-title">根因分析</div>';
            data.rootCauses.forEach(function(rc) {
                html += '<div class="rc-item">'
                    + '<div class="rc-title">' + escapeHtml(rc.title || '') + '</div>'
                    + '<div class="rc-desc">' + escapeHtml(rc.description || '') + '</div>'
                    + '</div>';
            });
        }

        if (data.actions && data.actions.length > 0) {
            html += '<div class="section-title">操作建议</div>';
            html += '<ul class="action-list">';
            data.actions.forEach(function(action) {
                html += '<li>' + escapeHtml(action) + '</li>';
            });
            html += '</ul>';
        }

        resultCard.innerHTML = html;
        resultCard.style.display = 'block';
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, function(c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // 加载环境信息
    fetch('/api/v1/env/list').then(function(r) { return r.json(); }).then(function(data) {
        var active = data.active || '-';
        var envs = data.envs || [];
        var activeEnv = envs.find(function(e) { return e.name === active; });
        var label = (activeEnv && activeEnv.label) ? activeEnv.label : active;
        document.getElementById('envLabel').textContent = label;

        // 填充平台 URL 输入框
        if (data.platformUrl) document.getElementById('platformUrlInput').value = data.platformUrl;
        if (data.mapUrl && data.mapUrl !== data.platformUrl) document.getElementById('mapUrlInput').value = data.mapUrl;

        // 渲染环境切换按钮
        var btnGroup = document.getElementById('envBtnGroup');
        btnGroup.innerHTML = '';
        envs.forEach(function(e) {
            var btn = document.createElement('button');
            btn.textContent = e.label || e.name;
            btn.title = e.wcsUrl || '';
            var isActive = e.name === active;
            btn.style.cssText = 'height:30px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:' + (isActive ? '700' : '500') + ';cursor:pointer;border:1.5px solid ' + (isActive ? '#6366f1' : 'rgba(99,102,241,0.2)') + ';background:' + (isActive ? 'rgba(99,102,241,0.12)' : 'transparent') + ';color:' + (isActive ? '#4f46e5' : '#6b7280') + ';';
            btn.onclick = function() { switchEnv(e.name); };
            btnGroup.appendChild(btn);
        });
    }).catch(function() {
        document.getElementById('envLabel').textContent = 'local';
    });

    function toggleEnvPanel() {
        var panel = document.getElementById('envPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    // 点击面板外关闭
    document.addEventListener('click', function(e) {
        var panel = document.getElementById('envPanel');
        var indicator = document.getElementById('envIndicator');
        if (panel.style.display !== 'none' && !panel.contains(e.target) && !indicator.contains(e.target)) {
            panel.style.display = 'none';
        }
    });

    function switchEnv(name) {
        fetch('/api/v1/env/switch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        }).then(function(r) { return r.json(); }).then(function(data) {
            var active = data.active || name;
            var envs = data.envs || [];
            var activeEnv = envs.find(function(e) { return e.name === active; });
            var label = (activeEnv && activeEnv.label) ? activeEnv.label : active;
            document.getElementById('envLabel').textContent = label;
            if (data.platformUrl) document.getElementById('platformUrlInput').value = data.platformUrl;
            // 重新渲染按钮
            var btnGroup = document.getElementById('envBtnGroup');
            btnGroup.querySelectorAll('button').forEach(function(btn) {
                var isActive = btn.textContent === label || btn.title === (activeEnv && activeEnv.wcsUrl);
                btn.style.fontWeight = isActive ? '700' : '500';
                btn.style.borderColor = isActive ? '#6366f1' : 'rgba(99,102,241,0.2)';
                btn.style.background = isActive ? 'rgba(99,102,241,0.12)' : 'transparent';
                btn.style.color = isActive ? '#4f46e5' : '#6b7280';
            });
            showSaveMsg();
        }).catch(function() {});
    }

    function savePlatformUrl() {
        var baseUrl = document.getElementById('platformUrlInput').value.trim();
        var mapBaseUrl = document.getElementById('mapUrlInput').value.trim();
        if (!baseUrl) return;
        fetch('/api/v1/env/platform-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ baseUrl: baseUrl, mapBaseUrl: mapBaseUrl || null })
        }).then(function() { showSaveMsg(); }).catch(function() {});
    }

    function showSaveMsg() {
        var msg = document.getElementById('envSaveMsg');
        msg.style.display = 'block';
        setTimeout(function() { msg.style.display = 'none'; }, 2000);
    }
</script>
</body>
</html>
