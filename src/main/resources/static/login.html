<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · WCS 智能诊断平台</title>
<link rel="stylesheet" href="common.css">
<style>
html, body { height: 100%; margin: 0; }
body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-gradient);
    font-family: var(--font-family);
}

.login-card {
    width: 400px;
    max-width: calc(100vw - 40px);
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: var(--glass-border);
    border-radius: var(--radius-card);
    box-shadow: var(--glass-shadow);
    padding: 48px 36px;
    text-align: center;
    animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.login-icon {
    font-size: 48px;
    margin-bottom: 16px;
    filter: drop-shadow(0 6px 16px rgba(99,102,241,0.25));
}

.login-title {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}

.login-subtitle {
    font-size: 14px;
    color: var(--color-text-muted);
    margin-bottom: 32px;
}

.form-group {
    margin-bottom: 16px;
    text-align: left;
}

.form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
}

.form-input {
    width: 100%;
    height: 44px;
    padding: 0 16px;
    font-size: 14px;
    border: 1.5px solid rgba(99,102,241,0.15);
    border-radius: var(--radius-input);
    outline: none;
    background: rgba(255,255,255,0.8);
    color: var(--color-text);
    transition: border-color 0.2s, box-shadow 0.2s;
    box-sizing: border-box;
}

.form-input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
}

.form-input.error {
    border-color: var(--color-error);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.08);
}

.error-msg {
    font-size: 12px;
    color: var(--color-error);
    margin-top: 12px;
    min-height: 18px;
    transition: opacity 0.2s;
}

.login-btn {
    margin-top: 20px;
    width: 100%;
    height: 44px;
    border: none;
    border-radius: var(--radius-btn);
    background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s;
}

.login-btn:hover {
    box-shadow: 0 6px 20px rgba(99,102,241,0.35);
    transform: translateY(-1px);
}

.login-btn:active {
    transform: translateY(0);
}

.login-footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--color-text-muted);
}
</style>
</head>
<body>

<div class="login-card">
    <div class="login-icon">🤖</div>
    <div class="login-title">WCS 智能诊断平台</div>
    <div class="login-subtitle">请输入账号密码登录系统</div>

    <div class="form-group">
        <label class="form-label" for="username">账号</label>
        <input class="form-input" id="username" type="text" placeholder="请输入账号" autocomplete="off">
    </div>

    <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input class="form-input" id="password" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="login-btn" onclick="doLogin()">登 录</button>

    <div class="login-footer">WCS 智能诊断平台 · Loong AI Diagnosis v1.0</div>
</div>

<script>
// 如果已登录，直接跳转
if (sessionStorage.getItem('wcs_logged_in') === 'true') {
    window.location.replace('home.html');
}

// 默认账号密码（首次使用时写入 localStorage）
function getCredentials() {
    let creds = localStorage.getItem('wcs_credentials');
    if (!creds) {
        const defaults = { username: 'admin', password: 'yyds' };
        localStorage.setItem('wcs_credentials', JSON.stringify(defaults));
        return defaults;
    }
    return JSON.parse(creds);
}

function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const inputs = document.querySelectorAll('.form-input');

    // 清除错误状态
    errorMsg.textContent = '';
    inputs.forEach(i => i.classList.remove('error'));

    if (!username || !password) {
        errorMsg.textContent = '请输入账号和密码';
        return;
    }

    const creds = getCredentials();
    if (username === creds.username && password === creds.password) {
        sessionStorage.setItem('wcs_logged_in', 'true');
        window.location.href = 'home.html';
    } else {
        errorMsg.textContent = '账号或密码错误，请重试';
        inputs.forEach(i => i.classList.add('error'));
        setTimeout(() => {
            inputs.forEach(i => i.classList.remove('error'));
        }, 1500);
    }
}

// 自动聚焦到账号输入框
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('username').focus();
});
</script>

</body>
</html>
