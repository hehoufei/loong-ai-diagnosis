rule-engine:
  rules:
    wait-split-stuck:
      enabled: true
      priority: 100
      description: "大任务长时间停在 WAIT_SPLIT"
      params:
        threshold-seconds: "60"
      output:
        summary: "任务卡在等待拆分阶段 {stuckMinutes} 分钟"
        root-causes:
          - title: "引擎未返回拆分结果"
            description: "大任务 {taskNo} 创建后 {stuckSeconds} 秒仍为 WAIT_SPLIT"
        actions:
          - "检查引擎服务是否可达"
          - "检查起终点路径可达性"
          - "查看平台日志中是否有拆分异常"

    wait-plan-stuck:
      enabled: true
      priority: 90
      description: "大任务 WAIT_PLAN 且无 RUNNING 子任务"
      params:
        threshold-seconds: "60"
      output:
        summary: "任务卡在等待规划阶段 {stuckMinutes} 分钟"
        root-causes:
          - title: "引擎规划阻塞"
            description: "大任务 {taskNo} 状态为 WAIT_PLAN，共 {itemCount} 个子任务，但 RUNNING 子任务数为 0"
        actions:
          - "检查引擎规划服务状态"
          - "确认任务组主子任务关系是否完整"
          - "核查起终点是否存在可达路径"

    running-but-items-waiting:
      enabled: true
      priority: 85
      description: "大任务 RUNNING 但所有子任务都是 WAIT_*"
      output:
        summary: "大任务 {taskNo} 已开始运行但 {itemCount} 个子任务全部处于等待状态"
        root-causes:
          - title: "子任务调度异常"
            description: "大任务 {taskState}，但所有子任务仍在 WAIT_ 前缀状态，调度器未成功驱动子任务执行"
        actions:
          - "检查子任务调度器运行状态"
          - "确认首个子任务的设备是否可用"
          - "查看子任务的 scheduleChannel 配置是否正确"

    command-not-sent:
      enabled: true
      priority: 80
      description: "存在 RUNNING 子任务但其下 Command 全部 WAIT"
      output:
        summary: "{runningItemCount} 个 RUNNING 子任务的指令未下发"
        root-causes:
          - title: "指令下发阻塞"
            description: "RUNNING 子任务下的所有指令都处于 WAIT 状态，DCS 未下发指令给设备"
        actions:
          - "检查 DCS 服务状态"
          - "确认设备是否处于可接收指令的状态"
          - "查看 DCS 队列是否有积压"

    plc-no-response:
      enabled: true
      priority: 80
      description: "存在 Command SENT 但无 plcTaskNo"
      output:
        summary: "指令已下发但 PLC 未响应"
        root-causes:
          - title: "PLC 通信异常"
            description: "指令状态为 SENT，但 PLC 未回填 plcTaskNo，怀疑 PLC 离线或通信链路异常"
        actions:
          - "检查 PLC 在线状态"
          - "确认 PLC 与 DCS 之间的通信链路"
          - "重启 PLC 适配器"

    command-timeout:
      enabled: true
      priority: 75
      description: "指令 SENT/ACKED 超时未完成"
      params:
        threshold-seconds: "300"
      output:
        summary: "存在指令执行超时"
        root-causes:
          - title: "指令执行超时"
            description: "部分指令 startTime 距今已超过 300 秒仍未完成，设备可能卡死或执行异常"
        actions:
          - "现场检查对应设备状态"
          - "查看设备日志是否有故障"
          - "必要时取消指令并重新下发"

    all-items-done-but-task-not-finished:
      enabled: true
      priority: 70
      description: "所有子任务 SUCCESS 但大任务未完成"
      output:
        summary: "所有子任务已完成但大任务 {taskNo} 仍为 {taskState}"
        root-causes:
          - title: "大任务收尾逻辑异常"
            description: "{itemCount} 个子任务均已 SUCCESS，但大任务未切换为终态"
        actions:
          - "检查任务收尾的调度回调"
          - "查看平台日志中是否有状态切换异常"
          - "必要时手工确认大任务完成"

    has-cancelled-items:
      enabled: true
      priority: 60
      description: "大任务未终态但存在 CANCEL 的子任务"
      output:
        summary: "大任务 {taskNo} 未终态但存在已取消的子任务"
        root-causes:
          - title: "子任务被取消"
            description: "部分子任务状态为 CANCEL，但大任务仍在运行或等待中，调度关系可能受影响"
        actions:
          - "查看取消子任务的原因（日志或操作记录）"
          - "确认剩余子任务能否独立完成"
          - "必要时取消整个大任务"

    task-paused:
      enabled: true
      priority: 50
      description: "任务或子任务被暂停"
      output:
        summary: "任务 {taskNo} 或其子任务被暂停"
        root-causes:
          - title: "任务被人为暂停"
            description: "paused=YES，任务被操作员或系统主动暂停"
        actions:
          - "核实暂停原因（操作记录或告警）"
          - "确认是否可以恢复执行"
          - "必要时手工恢复暂停的任务"

    task-group-not-split:
      enabled: true
      priority: 40
      description: "任务组长时间未完成拆分"
      params:
        threshold-seconds: "60"
      output:
        summary: "任务组 {taskNo} 尚未完成拆分"
        root-causes:
          - title: "任务组拆分未完成"
            description: "任务组 splitFinish=NOT_FINISH，且已过去 {stuckSeconds} 秒"
        actions:
          - "检查任务组拆分服务状态"
          - "确认主子任务数据是否就绪"
          - "查看平台日志中是否有拆分异常"

    fallback:
      enabled: true
      priority: -100
      description: "兜底规则，永远命中"
